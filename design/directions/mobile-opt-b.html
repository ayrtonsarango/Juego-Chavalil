<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mando Opción B: Horizontal Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chango&family=Fredoka:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    body {
      width: 100vw; height: 100dvh; overflow: hidden;
      background: #eef6ff;
      background-image: radial-gradient(#93c5fd 2.5px, transparent 2.5px);
      background-size: 28px 28px;
      font-family: 'Fredoka', sans-serif; color: #1e293b;
      display: flex; flex-direction: column;
      padding: 10px env(safe-area-inset-right, 16px) 10px env(safe-area-inset-left, 16px);
      gap: 8px;
    }

    /* Top Horizontal Bar */
    .top-bar-h {
      display: flex; align-items: center; justify-content: space-between;
      background: #ffffff; border: 3.5px solid #1e293b; border-radius: 18px;
      padding: 6px 18px; box-shadow: 3px 3px 0 #1e293b;
    }
    .profile-h { display: flex; align-items: center; gap: 8px; }
    .avatar-h {
      width: 36px; height: 36px; border-radius: 50%; overflow: hidden;
      background: #bae6fd; border: 2px solid #1e293b;
      display: flex; align-items: center; justify-content: center;
    }
    .txt-h { font-size: 17px; font-weight: 900; }
    .badge-node { background: #bae6fd; border: 2px solid #1e293b; border-radius: 10px; padding: 2px 10px; font-size: 13px; font-weight: 900; }

    /* Main Console Split (Left D-Pad, Center Soundboard, Right Actions) */
    .console-body {
      flex: 1; display: grid; grid-template-columns: 200px 1fr 200px; gap: 12px; align-items: center;
    }

    /* Left: D-Pad Section */
    .dpad-sector {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 26px;
      height: 100%; display: flex; align-items: center; justify-content: center;
      box-shadow: 4px 4px 0 #1e293b;
    }
    .dpad-grid-h {
      display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 52px);
      gap: 4px;
    }
    .dp-btn-h {
      background: #bae6fd; border: 3px solid #1e293b; border-radius: 14px;
      box-shadow: 0 4px 0 #0284c7, 0 4px 0 2.5px #1e293b;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900; color: #0f172a; cursor: pointer;
    }
    .dp-btn-h:active { transform: translateY(2px); box-shadow: 0 2px 0 #0284c7, 0 2px 0 2.5px #1e293b; }
    .dp-up-h { grid-column: 2; grid-row: 1; }
    .dp-left-h { grid-column: 1; grid-row: 2; }
    .dp-center-h { grid-column: 2; grid-row: 2; background: #e0f2fe; border: 2px dashed #0284c7; border-radius: 8px; }
    .dp-right-h { grid-column: 3; grid-row: 2; }
    .dp-down-h { grid-column: 2; grid-row: 3; }

    /* Center: Soundboard & Squad Tools */
    .center-sector {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 26px;
      height: 100%; display: flex; flex-direction: column; justify-content: space-between;
      padding: 10px 14px; box-shadow: 4px 4px 0 #1e293b;
    }
    .btn-gather-big {
      background: #fde047; border: 3px solid #1e293b; border-radius: 16px;
      padding: 8px; text-align: center; font-size: 14px; font-weight: 900;
      box-shadow: 3px 3px 0 #1e293b; cursor: pointer;
    }
    .btn-gather-big:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #1e293b; }
    .sb-grid-h {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
    }
    .sb-pill-h {
      border: 2.5px solid #1e293b; border-radius: 12px; padding: 8px 4px;
      font-size: 11px; font-weight: 900; text-align: center; box-shadow: 0 3px 0 #1e293b;
      cursor: pointer;
    }
    .sb-pill-h:active { transform: translateY(2px); box-shadow: 0 1px 0 #1e293b; }

    /* Right: Action Candy Buttons */
    .action-sector {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 26px;
      height: 100%; display: flex; flex-direction: column; gap: 10px; justify-content: center;
      padding: 12px; box-shadow: 4px 4px 0 #1e293b;
    }
    .btn-circle-action {
      flex: 1; border: 4px solid #1e293b; border-radius: 22px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; text-align: center;
    }
    .btn-circle-action.btn-1 {
      background: #f43f5e; color: #ffffff; box-shadow: 0 5px 0 #9f1239, 0 5px 0 3px #1e293b;
    }
    .btn-circle-action.btn-1:active { transform: translateY(3px); box-shadow: 0 2px 0 #9f1239, 0 2px 0 3px #1e293b; }
    .btn-circle-action.btn-2 {
      background: #22c55e; color: #ffffff; box-shadow: 0 5px 0 #15803d, 0 5px 0 3px #1e293b;
    }
    .btn-circle-action.btn-2:active { transform: translateY(3px); box-shadow: 0 2px 0 #15803d, 0 2px 0 3px #1e293b; }
    .circle-lbl { font-family: 'Chango', cursive; font-size: 18px; }
    .circle-sub { font-size: 10px; font-weight: 900; opacity: 0.95; }
  </style>
</head>
<body>
  <div class="top-bar-h">
    <div class="profile-h">
      <div class="avatar-h">
    <svg viewBox="0 0 112 112" width="56" height="56" xmlns="http://www.w3.org/2000/svg" class="avatar-svg  ">
      <!-- Sombra base -->
      <ellipse cx="56" cy="107" rx="28" ry="4" fill="#000000" opacity="0.22" class="avatar-shadow"/>

      <!-- Contenedor con altura dinámica -->
      <g >
        <!-- Pies / Zapatos animados para correr estilo Mario -->
        <g class="avatar-feet">
          
      <ellipse class="avatar-foot-left" cx="42" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
      <ellipse class="avatar-foot-right" cx="70" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
    
        </g>

        <!-- Cuerpo / Ropa (Sudadera, Polo, Chupa de Cuero o Camiseta Negra) -->
        <g id="body">
          <path d="M 32 80 C 26 88, 24 102, 34 104 L 78 104 C 88 102, 86 88, 80 80 Z" fill="#f59e0b" stroke="#1e293b" stroke-width="2.5"/>
          
    <!-- Cremallera central de sudadera -->
    <line x1="56" y1="80" x2="56" y2="103" stroke="#1e293b" stroke-width="2" stroke-dasharray="2 2"/>
  
        </g>

        <!-- Air Jordans CÓMICAMENTE GRANDES renderizadas por encima de la ropa si está activado -->
        

        <!-- Brazos / Manos animadas que bombean al correr -->
        <g class="avatar-arm-left">
          <circle class="avatar-hand-left" cx="28" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
        </g>
        <g class="avatar-arm-right">
          <circle class="avatar-hand-right" cx="84" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
          
        </g>

        <!-- Cabeza con silueta personalizada -->
        <g id="head" class="avatar-head">
          
    <!-- Cabeza redonda clásica South Park / Chibi -->
    <ellipse cx="56" cy="54" rx="34" ry="32" fill="#ffe0bd" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="34" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
    <circle cx="78" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
  
        </g>

        <!-- Pelo -->
        <g id="hair">
        <!-- Pelo Despeinado Chavalil (Ayrton) con mechones dinámicos y volumen -->
        <!-- Sombra base detrás de la silueta -->
        <path d="M 18 48 C 14 36, 18 24, 28 17 C 36 12, 48 11, 56 11 C 66 11, 76 13, 85 18 C 94 25, 98 36, 94 48 Q 78 30 56 30 Q 34 30 18 48 Z" fill="#090d16" opacity="0.45"/>
        <!-- Silueta principal texturada con picos naturales -->
        <path d="M 19 48 C 15 37, 18 27, 26 21 L 29 25 L 36 15 L 43 21 L 52 12 L 58 12 L 67 19 L 76 14 L 81 23 L 90 20 C 97 29, 97 39, 93 48 C 87 43, 81 42, 75 44 C 67 38, 57 39, 49 43 C 41 38, 31 39, 23 45 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Mechones frontales con caída sobre la frente -->
        <path d="M 27 43 Q 33 37 41 42 Q 49 36 57 41 Q 65 35 75 40 Q 82 36 86 43" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <!-- Mechones sueltos pícaros -->
        <path d="M 33 24 Q 38 18 44 23" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M 60 21 Q 66 16 71 22" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Brillo / highlight sutil superior -->
        <path d="M 38 19 Q 54 14 70 19" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
      </g>

        <!-- Ojos -->
        <g id="eyes">
        <!-- Ojos chinillos / achinados pícaros (Ayrton) -->
        <path d="M 32 53 Q 44 46 54 54 Q 44 51 32 53 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 58 54 Q 68 46 80 53 Q 68 51 58 54 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Pestañita pícara sonriente -->
        <line x1="31" y1="52" x2="27" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <line x1="81" y1="52" x2="85" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      </g>

        <!-- Boca -->
        <g id="mouth">
        <!-- Cara loca con lengua fuera desquiciada (Ayrton) -->
        <ellipse cx="56" cy="69" rx="12" ry="7" fill="#7f1d1d" stroke="#0f172a" stroke-width="2"/>
        <rect x="50" y="63" width="12" height="4" rx="1.5" fill="#ffffff"/>
        <!-- Lengua fuera cayendo hacia abajo -->
        <path d="M 49 69 C 48 84, 63 86, 62 70 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="1.8"/>
        <line x1="55.5" y1="70" x2="55.5" y2="79" stroke="#be123c" stroke-width="1.2"/>
        <!-- Gotita de baba derp -->
        <circle cx="64" cy="80" r="1.5" fill="#38bdf8" opacity="0.8"/>
      </g>

        <!-- Accesorios -->
        <g id="accessories"></g>
      </g>
    </svg>
  </div>
      <div class="txt-h">JUEGO CHAVALIL · AYRTON (AZUL)</div>
    </div>
    <div class="badge-node">📍 MUNDO 1-1 · J1</div>
  </div>

  <div class="console-body">
    <!-- D-Pad Left -->
    <div class="dpad-sector">
      <div class="dpad-grid-h">
        <div class="dp-btn-h dp-up-h">▲</div>
        <div class="dp-btn-h dp-left-h">◀</div>
        <div class="dp-center-h"></div>
        <div class="dp-btn-h dp-right-h">▶</div>
        <div class="dp-btn-h dp-down-h">▼</div>
      </div>
    </div>

    <!-- Center Utilities & Soundboard -->
    <div class="center-sector">
      <div class="btn-gather-big">🧲 ¡TODOS AQUÍ! (REUNIR AL PELOTÓN)</div>
      <div style="font-size: 11px; font-weight: 900; text-align: center; color: #0284c7;">🔊 MEME SOUNDBOARD</div>
      <div class="sb-grid-h">
        <div class="sb-pill-h" style="background:#fed7aa;">📢 BOCINA</div>
        <div class="sb-pill-h" style="background:#bae6fd;">🐺 AUUUU</div>
        <div class="sb-pill-h" style="background:#fef08a;">🍦 BING</div>
        <div class="sb-pill-h" style="background:#fecdd3;">🗣️ FAAAH</div>
        <div class="sb-pill-h" style="background:#ddd6fe;">😱 OMG</div>
        <div class="sb-pill-h" style="background:#bbf7d0;">💣 ALLAH</div>
      </div>
    </div>

    <!-- Right Action Buttons -->
    <div class="action-sector">
      <div class="btn-circle-action btn-1">
        <span class="circle-lbl">ENTRAR</span>
        <span class="circle-sub">AL NIVEL</span>
      </div>
      <div class="btn-circle-action btn-2">
        <span class="circle-lbl">AVANZAR</span>
        <span class="circle-sub">EN EL MAPA</span>
      </div>
    </div>
  </div>
</body>
</html>
