<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mando 2B: Dual-Zone Arcade Remote</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chango&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
    body {
      width: 100vw; height: 100dvh; overflow: hidden;
      background: #f8fafc;
      font-family: 'Outfit', sans-serif; color: #1e293b;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top, 14px) 16px env(safe-area-inset-bottom, 14px) 16px;
    }
    .player-strip {
      background: #ffffff; border: 3px solid #1e293b; border-radius: 20px;
      padding: 10px 14px; box-shadow: 4px 4px 0 #1e293b;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .player-profile { display: flex; align-items: center; gap: 10px; }
    .avatar-frame {
      width: 44px; height: 44px; border: 2.5px solid #1e293b; border-radius: 50%;
      overflow: hidden; background: #bae6fd; display: flex; align-items: center; justify-content: center;
    }
    .player-name { font-size: 20px; font-weight: 900; }
    .badge-j1 {
      background: #1e293b; color: #38bdf8; font-size: 13px; font-weight: 900;
      padding: 4px 12px; border-radius: 10px;
    }

    .status-hud {
      background: #e0f2fe; border: 2.5px solid #1e293b; border-radius: 14px;
      padding: 6px 12px; text-align: center; font-size: 13px; font-weight: 800; color: #0369a1;
      margin-bottom: 14px; box-shadow: 3px 3px 0 #1e293b;
    }

    /* CONTROL SURFACE: SPLIT THUMB ZONES */
    .ctrl-surface {
      flex: 1; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 14px; align-items: center;
    }

    /* Tactile Disc on Left */
    .disc-container {
      width: 190px; height: 190px; border-radius: 50%;
      background: #ffffff; border: 3.5px solid #1e293b;
      box-shadow: 5px 5px 0 #1e293b;
      position: relative; margin: 0 auto;
      display: flex; align-items: center; justify-content: center;
    }
    .disc-arrow {
      position: absolute; font-size: 24px; font-weight: 900; color: #1e293b;
      width: 48px; height: 48px; display: flex; align-items: center; justify-content: center;
    }
    .disc-arrow:active { color: #3b82f6; transform: scale(1.15); }
    .disc-up { top: 6px; left: 50%; transform: translateX(-50%); }
    .disc-down { bottom: 6px; left: 50%; transform: translateX(-50%); }
    .disc-left { left: 6px; top: 50%; transform: translateY(-50%); }
    .disc-right { right: 6px; top: 50%; transform: translateY(-50%); }
    .disc-hub {
      width: 70px; height: 70px; border-radius: 50%;
      background: #f1f5f9; border: 2.5px solid #1e293b;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; color: #64748b;
    }

    /* Right Action Cluster: Massive Push Button */
    .action-side {
      display: flex; flex-direction: column; gap: 12px; height: 100%; justify-content: center;
    }
    .btn-big-push {
      flex: 1.3; border: 3.5px solid #1e293b; border-radius: 24px;
      background: #22c55e; color: #ffffff; font-family: 'Chango', cursive; font-size: 18px;
      box-shadow: 5px 5px 0 #15803d, 5px 5px 0 3.5px #1e293b;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; text-align: center; padding: 12px;
    }
    .btn-big-push:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 #15803d, 2px 2px 0 3.5px #1e293b; }

    .btn-sub-action {
      flex: 0.8; border: 3px solid #1e293b; border-radius: 18px;
      background: #facc15; color: #1e293b; font-size: 14px; font-weight: 900;
      box-shadow: 4px 4px 0 #ca8a04, 4px 4px 0 3px #1e293b;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .btn-sub-action:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #ca8a04, 2px 2px 0 3px #1e293b; }

    /* Soundboard */
    .sb-bar {
      background: #ffffff; border: 3px solid #1e293b; border-radius: 16px;
      padding: 8px; box-shadow: 3px 3px 0 #1e293b; margin-top: 10px;
    }
    .sb-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
    .sb-btn {
      background: #f1f5f9; border: 1.5px solid #1e293b; border-radius: 10px; padding: 6px 2px;
      font-size: 10px; font-weight: 900; text-align: center;
    }
  </style>
</head>
<body>
  <div class="player-strip">
    <div class="player-profile">
      <div class="avatar-frame">
    <svg viewBox="0 0 112 112" width="56" height="56" xmlns="http://www.w3.org/2000/svg" class="avatar-svg  ">
      <!-- Sombra base -->
      <ellipse cx="56" cy="107" rx="28" ry="4" fill="#000000" opacity="0.22" class="avatar-shadow"/>

      <!-- Contenedor con altura dinámica -->
      <g >
        <!-- Pies / Zapatos animados para correr estilo Mario -->
        <g class="avatar-feet">
          
      <ellipse class="avatar-foot-left" cx="42" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
      <ellipse class="avatar-foot-right" cx="70" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
    
        </g>

        <!-- Cuerpo / Ropa (Sudadera, Polo, Chupa de Cuero o Camiseta Negra) -->
        <g id="body">
          <path d="M 32 80 C 26 88, 24 102, 34 104 L 78 104 C 88 102, 86 88, 80 80 Z" fill="#f59e0b" stroke="#1e293b" stroke-width="2.5"/>
          
    <!-- Cremallera central de sudadera -->
    <line x1="56" y1="80" x2="56" y2="103" stroke="#1e293b" stroke-width="2" stroke-dasharray="2 2"/>
  
        </g>

        <!-- Air Jordans CÓMICAMENTE GRANDES renderizadas por encima de la ropa si está activado -->
        

        <!-- Brazos / Manos animadas que bombean al correr -->
        <g class="avatar-arm-left">
          <circle class="avatar-hand-left" cx="28" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
        </g>
        <g class="avatar-arm-right">
          <circle class="avatar-hand-right" cx="84" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
          
        </g>

        <!-- Cabeza con silueta personalizada -->
        <g id="head" class="avatar-head">
          
    <!-- Cabeza redonda clásica South Park / Chibi -->
    <ellipse cx="56" cy="54" rx="34" ry="32" fill="#ffe0bd" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="34" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
    <circle cx="78" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
  
        </g>

        <!-- Pelo -->
        <g id="hair">
        <!-- Pelo Despeinado Chavalil (Ayrton) con mechones dinámicos y volumen -->
        <!-- Sombra base detrás de la silueta -->
        <path d="M 18 48 C 14 36, 18 24, 28 17 C 36 12, 48 11, 56 11 C 66 11, 76 13, 85 18 C 94 25, 98 36, 94 48 Q 78 30 56 30 Q 34 30 18 48 Z" fill="#090d16" opacity="0.45"/>
        <!-- Silueta principal texturada con picos naturales -->
        <path d="M 19 48 C 15 37, 18 27, 26 21 L 29 25 L 36 15 L 43 21 L 52 12 L 58 12 L 67 19 L 76 14 L 81 23 L 90 20 C 97 29, 97 39, 93 48 C 87 43, 81 42, 75 44 C 67 38, 57 39, 49 43 C 41 38, 31 39, 23 45 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Mechones frontales con caída sobre la frente -->
        <path d="M 27 43 Q 33 37 41 42 Q 49 36 57 41 Q 65 35 75 40 Q 82 36 86 43" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <!-- Mechones sueltos pícaros -->
        <path d="M 33 24 Q 38 18 44 23" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M 60 21 Q 66 16 71 22" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Brillo / highlight sutil superior -->
        <path d="M 38 19 Q 54 14 70 19" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
      </g>

        <!-- Ojos -->
        <g id="eyes">
        <!-- Ojos chinillos / achinados pícaros (Ayrton) -->
        <path d="M 32 53 Q 44 46 54 54 Q 44 51 32 53 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 58 54 Q 68 46 80 53 Q 68 51 58 54 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Pestañita pícara sonriente -->
        <line x1="31" y1="52" x2="27" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <line x1="81" y1="52" x2="85" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      </g>

        <!-- Boca -->
        <g id="mouth">
        <!-- Cara loca con lengua fuera desquiciada (Ayrton) -->
        <ellipse cx="56" cy="69" rx="12" ry="7" fill="#7f1d1d" stroke="#0f172a" stroke-width="2"/>
        <rect x="50" y="63" width="12" height="4" rx="1.5" fill="#ffffff"/>
        <!-- Lengua fuera cayendo hacia abajo -->
        <path d="M 49 69 C 48 84, 63 86, 62 70 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="1.8"/>
        <line x1="55.5" y1="70" x2="55.5" y2="79" stroke="#be123c" stroke-width="1.2"/>
        <!-- Gotita de baba derp -->
        <circle cx="64" cy="80" r="1.5" fill="#38bdf8" opacity="0.8"/>
      </g>

        <!-- Accesorios -->
        <g id="accessories"></g>
      </g>
    </svg>
  </div>
      <div class="player-name">Ayrton</div>
    </div>
    <div class="badge-j1">J1 · AZUL</div>
  </div>

  <div class="status-hud">
    📍 MUNDO 1-1 · 4 CHAVALES REUNIDOS
  </div>

  <div class="ctrl-surface">
    <!-- Tactile Disc -->
    <div class="disc-container">
      <div class="disc-arrow disc-up">▲</div>
      <div class="disc-arrow disc-down">▼</div>
      <div class="disc-arrow disc-left">◀</div>
      <div class="disc-arrow disc-right">▶</div>
      <div class="disc-hub">RUMBO</div>
    </div>

    <!-- Action Side -->
    <div class="action-side">
      <div class="btn-big-push">
        ENTRAR
        <span style="font-family:'Outfit'; font-size: 11px; font-weight: 800; opacity: 0.9;">AL NIVEL</span>
      </div>
      <div class="btn-sub-action">
        REUNIR PELOTÓN
      </div>
    </div>
  </div>

  <div class="sb-bar">
    <div class="sb-grid">
      <div class="sb-btn">BOCINA</div>
      <div class="sb-btn">AUUU</div>
      <div class="sb-btn">BING</div>
      <div class="sb-btn">FAAH</div>
      <div class="sb-btn">OMG</div>
      <div class="sb-btn">ALLAH</div>
    </div>
  </div>
</body>
</html>
