<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mando Super Smash Light</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chango&family=Fredoka:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    body {
      width: 100vw; height: 100dvh; overflow: hidden;
      background: #f0f7ff;
      background-image: radial-gradient(#93c5fd 2.5px, transparent 2.5px);
      background-size: 24px 24px;
      font-family: 'Fredoka', sans-serif; color: #1e293b;
      display: flex; flex-direction: column;
    }
    .phone-hdr-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; color: #ffffff; border-radius: 18px;
      padding: 8px 14px; margin-bottom: 8px; flex-shrink: 0;
    }
    .phone-hdr-user { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; }
    .dot-blue { width: 10px; height: 10px; border-radius: 50%; background: #38bdf8; display: inline-block; }
    .badge-sub { background: #38bdf8; color: #0f172a; border-radius: 8px; padding: 2px 8px; font-size: 11px; font-weight: 900; }
  
    body { padding: 10px env(safe-area-inset-right, 16px) 10px env(safe-area-inset-left, 16px); gap: 8px; }

    .smash-board {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    }
    .left-dpad-box {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 26px;
      padding: 12px; box-shadow: 5px 5px 0 #1e293b;
      display: flex; align-items: center; justify-content: center;
    }
    .dpad-smash {
      display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px);
      gap: 4px;
    }
    .sp-k {
      background: #bae6fd; border: 3px solid #1e293b; border-radius: 14px;
      box-shadow: 0 4px 0 #0284c7, 0 4px 0 2px #1e293b;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; font-weight: 900; color: #0f172a; cursor: pointer;
    }
    .sp-k:active { transform: translateY(2px); box-shadow: 0 1px 0 #0284c7, 0 1px 0 2px #1e293b; }
    .sp-u { grid-column: 2; grid-row: 1; background: #facc15; }
    .sp-l { grid-column: 1; grid-row: 2; }
    .sp-r { grid-column: 3; grid-row: 2; }
    .sp-d { grid-column: 2; grid-row: 3; }

    /* Right: 4-Candy Circle Cluster (Panel 5 style) */
    .right-cluster-box {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 26px;
      padding: 12px; box-shadow: 5px 5px 0 #1e293b;
      display: flex; align-items: center; justify-content: center;
    }
    .cluster-grid {
      display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px);
      gap: 6px;
    }
    .candy-circle {
      border: 3.5px solid #1e293b; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; font-family: 'Chango', cursive;
    }
    .candy-circle:active { transform: scale(0.92); }
    .cc-x { grid-column: 2; grid-row: 1; background: #38bdf8; color: #0f172a; box-shadow: 0 5px 0 #0284c7; }
    .cc-a { grid-column: 3; grid-row: 2; background: #f472b6; color: #ffffff; box-shadow: 0 5px 0 #db2777; }
    .cc-y { grid-column: 1; grid-row: 2; background: #4ade80; color: #0f172a; box-shadow: 0 5px 0 #16a34a; }
    .cc-b { grid-column: 2; grid-row: 3; background: #facc15; color: #0f172a; box-shadow: 0 5px 0 #ca8a04; }
    .c-letter { font-size: 20px; line-height: 1; }
    .c-word { font-family: 'Fredoka', sans-serif; font-size: 8px; font-weight: 900; }
  </style>
</head>
<body>
  <div class="phone-hdr-bar">
    <div class="phone-hdr-user">
      <span class="dot-blue"></span>
      <span>SUPER SMASH · AYRTON (AZUL)</span>
    </div>
    <div class="badge-sub">DAÑO: 38%</div>
  </div>

  <div class="smash-board">
    <div class="left-dpad-box">
      <div class="dpad-smash">
        <div class="sp-k sp-u">▲</div>
        <div class="sp-k sp-l">◀</div>
        <div class="sp-k sp-r">▶</div>
        <div class="sp-k sp-d">▼</div>
      </div>
    </div>

    <div class="right-cluster-box">
      <div class="cluster-grid">
        <div class="candy-circle cc-x">
          <span class="c-letter">X</span>
          <span class="c-word">SALTO</span>
        </div>
        <div class="candy-circle cc-y">
          <span class="c-letter">Y</span>
          <span class="c-word">ESCUDO</span>
        </div>
        <div class="candy-circle cc-a">
          <span class="c-letter">A</span>
          <span class="c-word">GOLPE</span>
        </div>
        <div class="candy-circle cc-b">
          <span class="c-letter">B</span>
          <span class="c-word">ESPECIAL</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
