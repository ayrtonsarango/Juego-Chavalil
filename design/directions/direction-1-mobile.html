<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mando (Dirección 1): Chunky Neo-Brutalist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    body {
      width: 100vw; height: 100dvh; overflow: hidden;
      background: #f8f6f0;
      font-family: 'Outfit', sans-serif; color: #0f172a;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
    }
    /* Player Strip */
    .player-strip {
      background: #ffffff; border: 3px solid #0f172a; border-radius: 16px;
      padding: 10px 14px; box-shadow: 4px 4px 0 #0f172a;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
    }
    .player-meta { display: flex; align-items: center; gap: 12px; }
    .strip-avatar {
      width: 44px; height: 44px; border: 2.5px solid #0f172a; border-radius: 10px;
      overflow: hidden; background: #bae6fd; display: flex; align-items: center; justify-content: center;
    }
    .strip-name { font-family: 'Fredoka', sans-serif; font-size: 20px; font-weight: 900; }
    .strip-badge {
      background: #0f172a; color: #facc15; font-size: 13px; font-weight: 900;
      padding: 4px 10px; border-radius: 8px; border: 1.5px solid #0f172a;
    }

    /* Screen Title */
    .nav-guide {
      text-align: center; margin-bottom: 8px;
    }
    .nav-guide h2 {
      font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 900; color: #0f172a;
    }
    .nav-pos-pill {
      display: inline-block; background: #e0f2fe; border: 2px solid #0f172a; border-radius: 8px;
      padding: 2px 10px; font-size: 13px; font-weight: 800; color: #0369a1; margin-top: 4px;
    }

    /* Controller Surface */
    .ctrl-surface {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: center;
    }

    /* D-PAD */
    .dpad-container {
      display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px);
      gap: 6px; justify-content: center; align-content: center;
    }
    .dpad-btn {
      background: #ffffff; border: 3px solid #0f172a; border-radius: 14px;
      box-shadow: 0 5px 0 #0f172a; font-family: 'Fredoka', sans-serif; font-size: 22px; font-weight: 900;
      display: flex; align-items: center; justify-content: center; color: #0f172a;
      cursor: pointer;
    }
    .dpad-btn:active {
      transform: translateY(3px); box-shadow: 0 2px 0 #0f172a;
    }
    .dpad-center {
      background: #e2e8f0; border: 2px dashed #94a3b8; border-radius: 10px;
    }
    .dpad-btn.up { grid-column: 2; grid-row: 1; }
    .dpad-btn.left { grid-column: 1; grid-row: 2; }
    .dpad-btn.right { grid-column: 3; grid-row: 2; }
    .dpad-btn.down { grid-column: 2; grid-row: 3; }

    /* ACTION CLUSTER */
    .action-cluster {
      display: flex; flex-direction: column; gap: 14px; justify-content: center; height: 100%;
    }
    .btn-act {
      border: 3.5px solid #0f172a; border-radius: 20px; padding: 18px 12px;
      font-family: 'Fredoka', sans-serif; font-weight: 900; font-size: 19px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; position: relative; text-align: center;
    }
    .btn-act.accept {
      background: #4ade80; color: #0f172a; box-shadow: 0 7px 0 #15803d, 0 7px 0 3px #0f172a;
      flex: 1.3;
    }
    .btn-act.accept:active {
      transform: translateY(4px); box-shadow: 0 3px 0 #15803d, 0 3px 0 3px #0f172a;
    }
    .btn-act.gather {
      background: #facc15; color: #0f172a; box-shadow: 0 5px 0 #ca8a04, 0 5px 0 3px #0f172a;
      flex: 1; font-size: 16px;
    }
    .btn-act.gather:active {
      transform: translateY(3px); box-shadow: 0 2px 0 #ca8a04, 0 2px 0 3px #0f172a;
    }

    /* Soundboard Strip */
    .sb-strip {
      background: #ffffff; border: 3px solid #0f172a; border-radius: 16px;
      padding: 10px; box-shadow: 4px 4px 0 #0f172a; margin-top: 10px;
    }
    .sb-title { font-size: 12px; font-weight: 900; text-transform: uppercase; color: #64748b; margin-bottom: 6px; }
    .sb-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .sb-btn {
      background: #f1f5f9; border: 2px solid #0f172a; border-radius: 10px; padding: 6px 2px;
      font-size: 10px; font-weight: 900; text-align: center; box-shadow: 0 3px 0 #0f172a;
    }
    .sb-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #0f172a; }
  </style>
</head>
<body>
  <div class="player-strip">
    <div class="player-meta">
      <div class="strip-avatar">
    <svg viewBox="0 0 112 112" width="56" height="56" xmlns="http://www.w3.org/2000/svg" class="avatar-svg  ">
      <!-- Sombra base -->
      <ellipse cx="56" cy="107" rx="28" ry="4" fill="#000000" opacity="0.22" class="avatar-shadow"/>

      <!-- Contenedor con altura dinámica -->
      <g >
        <!-- Pies / Zapatos animados para correr estilo Mario -->
        <g class="avatar-feet">
          
      <ellipse class="avatar-foot-left" cx="42" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
      <ellipse class="avatar-foot-right" cx="70" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
    
        </g>

        <!-- Cuerpo / Ropa (Sudadera, Polo, Chupa de Cuero o Camiseta Negra) -->
        <g id="body">
          <path d="M 32 80 C 26 88, 24 102, 34 104 L 78 104 C 88 102, 86 88, 80 80 Z" fill="#f59e0b" stroke="#1e293b" stroke-width="2.5"/>
          
    <!-- Cremallera central de sudadera -->
    <line x1="56" y1="80" x2="56" y2="103" stroke="#1e293b" stroke-width="2" stroke-dasharray="2 2"/>
  
        </g>

        <!-- Air Jordans CÓMICAMENTE GRANDES renderizadas por encima de la ropa si está activado -->
        

        <!-- Brazos / Manos animadas que bombean al correr -->
        <g class="avatar-arm-left">
          <circle class="avatar-hand-left" cx="28" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
        </g>
        <g class="avatar-arm-right">
          <circle class="avatar-hand-right" cx="84" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
          
        </g>

        <!-- Cabeza con silueta personalizada -->
        <g id="head" class="avatar-head">
          
    <!-- Cabeza redonda clásica South Park / Chibi -->
    <ellipse cx="56" cy="54" rx="34" ry="32" fill="#ffe0bd" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="34" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
    <circle cx="78" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
  
        </g>

        <!-- Pelo -->
        <g id="hair">
        <!-- Pelo Despeinado Chavalil (Ayrton) con mechones dinámicos y volumen -->
        <!-- Sombra base detrás de la silueta -->
        <path d="M 18 48 C 14 36, 18 24, 28 17 C 36 12, 48 11, 56 11 C 66 11, 76 13, 85 18 C 94 25, 98 36, 94 48 Q 78 30 56 30 Q 34 30 18 48 Z" fill="#090d16" opacity="0.45"/>
        <!-- Silueta principal texturada con picos naturales -->
        <path d="M 19 48 C 15 37, 18 27, 26 21 L 29 25 L 36 15 L 43 21 L 52 12 L 58 12 L 67 19 L 76 14 L 81 23 L 90 20 C 97 29, 97 39, 93 48 C 87 43, 81 42, 75 44 C 67 38, 57 39, 49 43 C 41 38, 31 39, 23 45 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Mechones frontales con caída sobre la frente -->
        <path d="M 27 43 Q 33 37 41 42 Q 49 36 57 41 Q 65 35 75 40 Q 82 36 86 43" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <!-- Mechones sueltos pícaros -->
        <path d="M 33 24 Q 38 18 44 23" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M 60 21 Q 66 16 71 22" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Brillo / highlight sutil superior -->
        <path d="M 38 19 Q 54 14 70 19" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
      </g>

        <!-- Ojos -->
        <g id="eyes">
        <!-- Ojos chinillos / achinados pícaros (Ayrton) -->
        <path d="M 32 53 Q 44 46 54 54 Q 44 51 32 53 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 58 54 Q 68 46 80 53 Q 68 51 58 54 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Pestañita pícara sonriente -->
        <line x1="31" y1="52" x2="27" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <line x1="81" y1="52" x2="85" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      </g>

        <!-- Boca -->
        <g id="mouth">
        <!-- Cara loca con lengua fuera desquiciada (Ayrton) -->
        <ellipse cx="56" cy="69" rx="12" ry="7" fill="#7f1d1d" stroke="#0f172a" stroke-width="2"/>
        <rect x="50" y="63" width="12" height="4" rx="1.5" fill="#ffffff"/>
        <!-- Lengua fuera cayendo hacia abajo -->
        <path d="M 49 69 C 48 84, 63 86, 62 70 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="1.8"/>
        <line x1="55.5" y1="70" x2="55.5" y2="79" stroke="#be123c" stroke-width="1.2"/>
        <!-- Gotita de baba derp -->
        <circle cx="64" cy="80" r="1.5" fill="#38bdf8" opacity="0.8"/>
      </g>

        <!-- Accesorios -->
        <g id="accessories"></g>
      </g>
    </svg>
  </div>
      <div class="strip-name">Ayrton</div>
    </div>
    <div class="strip-badge">J1 · AZUL</div>
  </div>

  <div class="nav-guide">
    <h2>MAPA OVERWORLD</h2>
    <div class="nav-pos-pill">Posición: Mundo 1-1 (Pelotón 4/4)</div>
  </div>

  <div class="ctrl-surface">
    <!-- D-PAD -->
    <div class="dpad-container">
      <div class="dpad-btn up">▲</div>
      <div class="dpad-btn left">◀</div>
      <div class="dpad-center"></div>
      <div class="dpad-btn right">▶</div>
      <div class="dpad-btn down">▼</div>
    </div>

    <!-- ACTION CLUSTER -->
    <div class="action-cluster">
      <div class="btn-act accept">
        ENTRAR
        <span style="font-size: 12px; font-weight: 700; opacity: 0.85;">PULSAR PARA CONFIRMAR</span>
      </div>
      <div class="btn-act gather">
        REUNIR PELOTÓN
      </div>
    </div>
  </div>

  <div class="sb-strip">
    <div class="sb-title">Soundboard Meme</div>
    <div class="sb-grid">
      <div class="sb-btn">BOCINA</div>
      <div class="sb-btn">AUUU</div>
      <div class="sb-btn">BING</div>
      <div class="sb-btn">FAAH</div>
      <div class="sb-btn">OMG</div>
      <div class="sb-btn">ALLAH</div>
    </div>
  </div>
</body>
</html>
