<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #f0f7ff;
      background-image: radial-gradient(#bae6fd 2px, transparent 2px);
      background-size: 28px 28px;
      font-family: 'Outfit', sans-serif;
      color: #1e293b;
      display: flex; flex-direction: column;
      padding: 36px 48px;
    }
    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; color: #ffffff;
      border-radius: 28px; padding: 18px 36px;
      box-shadow: 0 10px 0 #0f172a; margin-bottom: 30px;
    }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand-disc {
      width: 54px; height: 54px; background: #38bdf8; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: #0f172a; font-family: 'Chango', cursive; font-size: 24px;
    }
    .brand-title {
      font-family: 'Chango', cursive; font-size: 32px; color: #ffffff; letter-spacing: 0.5px;
    }
    .room-pill { display: flex; align-items: center; gap: 16px; }
    .url-chip {
      background: #0f172a; border: 2.5px solid #38bdf8; border-radius: 16px;
      padding: 8px 24px; font-size: 22px; font-weight: 800; color: #38bdf8;
    }
    .count-chip {
      background: #f59e0b; color: #0f172a; border-radius: 16px;
      padding: 8px 22px; font-size: 20px; font-weight: 900;
    }

    main { flex: 1; display: grid; grid-template-columns: 560px 1fr; gap: 36px; }
    .qr-card {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 36px;
      padding: 36px; box-shadow: 8px 8px 0 #1e293b;
      display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    }
    .qr-frame {
      padding: 16px; background: #ffffff; border: 3.5px solid #1e293b; border-radius: 24px;
      box-shadow: 6px 6px 0 #1e293b; margin-bottom: 24px;
    }
    .qr-frame img { width: 280px; height: 280px; display: block; border-radius: 10px; }
    .qr-card h2 { font-family: 'Chango', cursive; font-size: 28px; margin-bottom: 8px; }
    .qr-card p { font-size: 20px; font-weight: 800; color: #64748b; }

    .players-area {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 36px;
      padding: 36px; box-shadow: 8px 8px 0 #1e293b;
      display: flex; flex-direction: column;
    }
    .players-header {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 26px;
      padding-bottom: 16px; border-bottom: 3.5px dashed #cbd5e1;
    }
    .players-header h2 { font-family: 'Chango', cursive; font-size: 30px; }
    .players-header span { font-size: 20px; font-weight: 800; color: #64748b; }

    .players-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; flex: 1; }
    .p-card {
      border: 3.5px solid #1e293b; border-radius: 26px; padding: 18px 24px;
      display: flex; align-items: center; gap: 20px; background: #f8fafc;
      box-shadow: 6px 6px 0 #1e293b; position: relative;
    }
    .p-card.p1 { background: #bae6fd; }
    .p-card.p2 { background: #fecdd3; }
    .p-card.p3 { background: #bbf7d0; }
    .p-card.p4 { background: #fde68a; }

    .p-avatar {
      width: 90px; height: 90px; background: #ffffff; border: 3px solid #1e293b;
      border-radius: 50%; overflow: hidden; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; box-shadow: 3px 3px 0 #1e293b;
    }
    .p-info { flex: 1; }
    .p-name { font-size: 28px; font-weight: 900; margin-bottom: 6px; }
    .p-status {
      display: inline-block; background: #1e293b; color: #ffffff;
      border-radius: 10px; padding: 4px 14px; font-size: 14px; font-weight: 900;
    }

    footer.bottom-bar {
      margin-top: 24px; display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; color: #ffffff; border-radius: 24px; padding: 16px 36px;
      box-shadow: 0 10px 0 #0f172a;
    }
    .bottom-hint { font-size: 20px; font-weight: 800; color: #94a3b8; }
    .btn-start {
      background: #f97316; color: #ffffff; border: 3px solid #1e293b;
      font-family: 'Chango', cursive; font-size: 22px; padding: 12px 36px; border-radius: 18px;
      box-shadow: 4px 4px 0 #ffffff;
    }
  </style>
