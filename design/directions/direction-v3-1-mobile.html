<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mando 1: Chaval Wheel Doodle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chango&family=Fredoka:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    body {
      width: 100vw; height: 100dvh; overflow: hidden;
      background: #eef6ff;
      background-image: radial-gradient(#93c5fd 2.5px, transparent 2.5px);
      background-size: 32px 32px;
      font-family: 'Fredoka', sans-serif; color: #1e293b;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top, 14px) 16px env(safe-area-inset-bottom, 14px) 16px;
    }

    /* Player Profile Header Card */
    .player-card-strip {
      background: #ffffff; border: 3.5px solid #1e293b; border-radius: 24px;
      padding: 10px 14px; box-shadow: 4px 4px 0 #1e293b;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; transform: rotate(-0.8deg);
    }
    .profile-group { display: flex; align-items: center; gap: 10px; }
    .avatar-bubble {
      width: 48px; height: 48px; border-radius: 50%; overflow: hidden;
      background: #bae6fd; border: 2.5px solid #1e293b;
      display: flex; align-items: center; justify-content: center;
    }
    .player-meta h2 { font-size: 22px; font-weight: 900; color: #1e293b; line-height: 1.1; }
    .player-meta span { font-size: 12px; font-weight: 800; color: #0284c7; }
    .tag-j1 {
      background: #facc15; border: 2px solid #1e293b; border-radius: 12px;
      padding: 4px 10px; font-size: 13px; font-weight: 900; box-shadow: 2px 2px 0 #1e293b;
      transform: rotate(2deg);
    }

    /* Action Banner: Explain clearly what J1 can do */
    .squad-callout {
      background: #ffffff; border: 3px solid #1e293b; border-radius: 18px;
      padding: 8px 14px; box-shadow: 3px 3px 0 #1e293b; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .squad-txt { font-size: 13px; font-weight: 800; color: #475569; }
    .btn-gather-squad {
      background: #fde047; border: 2.5px solid #1e293b; border-radius: 14px;
      padding: 8px 12px; font-size: 12px; font-weight: 900; color: #1e293b;
      box-shadow: 2px 2px 0 #1e293b; cursor: pointer; white-space: nowrap;
    }
    .btn-gather-squad:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #1e293b; }

    /* HERO: CHAVAL TACTILE WHEEL (Ergonomic thumb disc with playful cartoon personality) */
    .wheel-arena {
      flex: 1; display: flex; align-items: center; justify-content: center;
    }
    .tactile-wheel {
      width: 260px; height: 260px; border-radius: 50%;
      background: #ffffff; border: 5px solid #1e293b;
      box-shadow: 0 12px 0 #1e293b, 0 16px 25px rgba(0,0,0,0.1);
      position: relative; display: flex; align-items: center; justify-content: center;
    }

    /* Compass Directions */
    .arrow-sector {
      position: absolute; display: flex; align-items: center; justify-content: center;
      font-size: 26px; font-weight: 900; color: #1e293b; cursor: pointer;
    }
    .arrow-sector:active { color: #0284c7; transform: scale(1.2); }
    .arrow-up { top: 12px; left: 50%; transform: translateX(-50%); width: 70px; height: 48px; }
    .arrow-down { bottom: 12px; left: 50%; transform: translateX(-50%); width: 70px; height: 48px; }
    .arrow-left { left: 12px; top: 50%; transform: translateY(-50%); width: 48px; height: 70px; }
    .arrow-right { right: 12px; top: 50%; transform: translateY(-50%); width: 48px; height: 70px; }

    /* Big Juicy Center Button */
    .juicy-center-btn {
      width: 114px; height: 114px; border-radius: 50%;
      background: #22c55e; border: 4px solid #1e293b;
      box-shadow: 0 6px 0 #15803d, inset 0 3px 0 rgba(255,255,255,0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #ffffff; cursor: pointer; text-shadow: 1px 1px 0 #15803d;
    }
    .juicy-center-btn:active {
      transform: translateY(4px); box-shadow: 0 2px 0 #15803d;
    }
    .btn-lbl-main { font-family: 'Chango', cursive; font-size: 16px; line-height: 1; }
    .btn-lbl-sub { font-size: 11px; font-weight: 900; opacity: 0.95; margin-top: 2px; }

    /* Soundboard Quick Meme Bar */
    .soundboard-shelf {
      background: #ffffff; border: 3.5px solid #1e293b; border-radius: 20px;
      padding: 8px 10px; box-shadow: 3px 3px 0 #1e293b; margin-top: 8px;
    }
    .shelf-label { font-size: 11px; font-weight: 900; text-transform: uppercase; color: #0284c7; margin-bottom: 6px; }
    .shelf-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
    .btn-meme-key {
      background: #f1f5f9; border: 2px solid #1e293b; border-radius: 12px; padding: 6px 2px;
      font-size: 10px; font-weight: 900; text-align: center; color: #1e293b;
      box-shadow: 0 2px 0 #1e293b;
    }
    .btn-meme-key:active { transform: translateY(1px); box-shadow: 0 1px 0 #1e293b; background: #fde047; }
  </style>
</head>
<body>
  <div class="player-card-strip">
    <div class="profile-group">
      <div class="avatar-bubble">
    <svg viewBox="0 0 112 112" width="58" height="58" xmlns="http://www.w3.org/2000/svg" class="avatar-svg  ">
      <!-- Sombra base -->
      <ellipse cx="56" cy="107" rx="28" ry="4" fill="#000000" opacity="0.22" class="avatar-shadow"/>

      <!-- Contenedor con altura dinámica -->
      <g >
        <!-- Pies / Zapatos animados para correr estilo Mario -->
        <g class="avatar-feet">
          
      <ellipse class="avatar-foot-left" cx="42" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
      <ellipse class="avatar-foot-right" cx="70" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
    
        </g>

        <!-- Cuerpo / Ropa (Sudadera, Polo, Chupa de Cuero o Camiseta Negra) -->
        <g id="body">
          <path d="M 32 80 C 26 88, 24 102, 34 104 L 78 104 C 88 102, 86 88, 80 80 Z" fill="#f59e0b" stroke="#1e293b" stroke-width="2.5"/>
          
    <!-- Cremallera central de sudadera -->
    <line x1="56" y1="80" x2="56" y2="103" stroke="#1e293b" stroke-width="2" stroke-dasharray="2 2"/>
  
        </g>

        <!-- Air Jordans CÓMICAMENTE GRANDES renderizadas por encima de la ropa si está activado -->
        

        <!-- Brazos / Manos animadas que bombean al correr -->
        <g class="avatar-arm-left">
          <circle class="avatar-hand-left" cx="28" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
        </g>
        <g class="avatar-arm-right">
          <circle class="avatar-hand-right" cx="84" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
          
        </g>

        <!-- Cabeza con silueta personalizada -->
        <g id="head" class="avatar-head">
          
    <!-- Cabeza redonda clásica South Park / Chibi -->
    <ellipse cx="56" cy="54" rx="34" ry="32" fill="#ffe0bd" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="34" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
    <circle cx="78" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
  
        </g>

        <!-- Pelo -->
        <g id="hair">
        <!-- Pelo Despeinado Chavalil (Ayrton) con mechones dinámicos y volumen -->
        <!-- Sombra base detrás de la silueta -->
        <path d="M 18 48 C 14 36, 18 24, 28 17 C 36 12, 48 11, 56 11 C 66 11, 76 13, 85 18 C 94 25, 98 36, 94 48 Q 78 30 56 30 Q 34 30 18 48 Z" fill="#090d16" opacity="0.45"/>
        <!-- Silueta principal texturada con picos naturales -->
        <path d="M 19 48 C 15 37, 18 27, 26 21 L 29 25 L 36 15 L 43 21 L 52 12 L 58 12 L 67 19 L 76 14 L 81 23 L 90 20 C 97 29, 97 39, 93 48 C 87 43, 81 42, 75 44 C 67 38, 57 39, 49 43 C 41 38, 31 39, 23 45 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Mechones frontales con caída sobre la frente -->
        <path d="M 27 43 Q 33 37 41 42 Q 49 36 57 41 Q 65 35 75 40 Q 82 36 86 43" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <!-- Mechones sueltos pícaros -->
        <path d="M 33 24 Q 38 18 44 23" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M 60 21 Q 66 16 71 22" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Brillo / highlight sutil superior -->
        <path d="M 38 19 Q 54 14 70 19" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
      </g>

        <!-- Ojos -->
        <g id="eyes">
        <!-- Ojos chinillos / achinados pícaros (Ayrton) -->
        <path d="M 32 53 Q 44 46 54 54 Q 44 51 32 53 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 58 54 Q 68 46 80 53 Q 68 51 58 54 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Pestañita pícara sonriente -->
        <line x1="31" y1="52" x2="27" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <line x1="81" y1="52" x2="85" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      </g>

        <!-- Boca -->
        <g id="mouth">
        <!-- Cara loca con lengua fuera desquiciada (Ayrton) -->
        <ellipse cx="56" cy="69" rx="12" ry="7" fill="#7f1d1d" stroke="#0f172a" stroke-width="2"/>
        <rect x="50" y="63" width="12" height="4" rx="1.5" fill="#ffffff"/>
        <!-- Lengua fuera cayendo hacia abajo -->
        <path d="M 49 69 C 48 84, 63 86, 62 70 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="1.8"/>
        <line x1="55.5" y1="70" x2="55.5" y2="79" stroke="#be123c" stroke-width="1.2"/>
        <!-- Gotita de baba derp -->
        <circle cx="64" cy="80" r="1.5" fill="#38bdf8" opacity="0.8"/>
      </g>

        <!-- Accesorios -->
        <g id="accessories"></g>
      </g>
    </svg>
  </div>
      <div class="player-meta">
        <h2>Ayrton</h2>
        <span>MUNDO 1-1</span>
      </div>
    </div>
    <div class="tag-j1">👑 J1 LÍDER</div>
  </div>

  <div class="squad-callout">
    <div class="squad-txt">Pelotón: <b>4/4 reunidos</b></div>
    <div class="btn-gather-squad">🧲 ¡TODOS AQUÍ!</div>
  </div>

  <div class="wheel-arena">
    <div class="tactile-wheel">
      <div class="arrow-sector arrow-up">▲</div>
      <div class="arrow-sector arrow-down">▼</div>
      <div class="arrow-sector arrow-left">◀</div>
      <div class="arrow-sector arrow-right">▶</div>

      <div class="juicy-center-btn">
        <span class="btn-lbl-main">¡ENTRAR!</span>
        <span class="btn-lbl-sub">AL NIVEL</span>
      </div>
    </div>
  </div>

  <div class="soundboard-shelf">
    <div class="shelf-label">🔊 MEME SOUNDBOARD</div>
    <div class="shelf-grid">
      <div class="btn-meme-key">BOCINA</div>
      <div class="btn-meme-key">AUUU</div>
      <div class="btn-meme-key">BING</div>
      <div class="btn-meme-key">FAAH</div>
      <div class="btn-meme-key">OMG</div>
      <div class="btn-meme-key">ALLAH</div>
    </div>
  </div>
</body>
</html>
