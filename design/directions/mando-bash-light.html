<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mando Button Bash Light</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chango&family=Fredoka:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    body {
      width: 100vw; height: 100dvh; overflow: hidden;
      background: #f0f7ff;
      background-image: radial-gradient(#93c5fd 2.5px, transparent 2.5px);
      background-size: 24px 24px;
      font-family: 'Fredoka', sans-serif; color: #1e293b;
      display: flex; flex-direction: column;
    }
    .phone-hdr-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; color: #ffffff; border-radius: 18px;
      padding: 8px 14px; margin-bottom: 8px; flex-shrink: 0;
    }
    .phone-hdr-user { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; }
    .dot-blue { width: 10px; height: 10px; border-radius: 50%; background: #38bdf8; display: inline-block; }
    .badge-sub { background: #38bdf8; color: #0f172a; border-radius: 8px; padding: 2px 8px; font-size: 11px; font-weight: 900; }
  
    body { padding: env(safe-area-inset-top, 12px) 14px env(safe-area-inset-bottom, 12px) 14px; gap: 10px; }

    .buzzer-box {
      flex: 1; background: #ffffff; border: 4px solid #1e293b; border-radius: 28px;
      padding: 16px; box-shadow: 5px 5px 0 #1e293b;
      display: flex; flex-direction: column; align-items: center; justify-content: space-around;
      text-align: center;
    }
    .instruct-txt { font-family: 'Chango', cursive; font-size: 16px; color: #0284c7; }

    /* Balanced Candy Buzzer (190px, neither too small nor taking the entire screen) */
    .candy-buzzer {
      width: 190px; height: 190px; border-radius: 50%;
      background: #38bdf8; border: 5px solid #1e293b;
      box-shadow: 0 10px 0 #0284c7, 0 10px 0 4px #1e293b, inset 0 5px 0 rgba(255,255,255,0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; color: #0f172a;
    }
    .candy-buzzer:active { transform: translateY(6px); box-shadow: 0 4px 0 #0284c7, 0 4px 0 4px #1e293b; }
    .b-icon { font-size: 44px; }
    .b-txt { font-family: 'Chango', cursive; font-size: 28px; }

    .hint-sub { font-size: 13px; font-weight: 800; color: #64748b; }

    .sb-shelf {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 22px;
      padding: 10px; box-shadow: 4px 4px 0 #1e293b; flex-shrink: 0;
    }
    .sb-hdr-txt { font-family: 'Chango', cursive; font-size: 12px; color: #1e293b; margin-bottom: 6px; }
    .sb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .sb-k {
      border: 2.5px solid #1e293b; border-radius: 12px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; color: #0f172a; box-shadow: 0 3px 0 #1e293b;
    }
  </style>
</head>
<body>
  <div class="phone-hdr-bar">
    <div class="phone-hdr-user">
      <span class="dot-blue"></span>
      <span>BUTTON BASH · AYRTON (AZUL)</span>
    </div>
    <div class="badge-sub">DIANA EN PARED</div>
  </div>

  <div class="buzzer-box">
    <div class="instruct-txt">¡DISPARA EL DARDO!</div>

    <div class="candy-buzzer">
      <span class="b-icon">🎯</span>
      <span class="b-txt">¡PULSA!</span>
    </div>

    <div class="hint-sub">1ª pulsación fija la X · 2ª pulsación fija la Y</div>
  </div>

  <div class="sb-shelf">
    <div class="sb-hdr-txt">🔊 MEME SOUNDBOARD</div>
    <div class="sb-grid">
      <div class="sb-k" style="background:#fed7aa;">📢 BOCINA</div>
      <div class="sb-k" style="background:#bae6fd;">🐺 AUUUU</div>
      <div class="sb-k" style="background:#fef08a;">🍦 BING</div>
      <div class="sb-k" style="background:#fecdd3;">🗣️ FAAAH</div>
      <div class="sb-k" style="background:#ddd6fe;">😱 OMG</div>
      <div class="sb-k" style="background:#bbf7d0;">💣 ALLAH</div>
    </div>
  </div>
</body>
</html>
