<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mando Overworld - Optimizado</title>
  <style>
    
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap');

  :root {
    --navy: #1e293b;
    --navy-dark: #0f172a;
    --navy-skirt: #090d16;
    --border-w: 3.5px;
    --border-btn: 3.5px;
    
    /* Vibrant Candy Palette */
    --c-cyan: #38bdf8;
    --c-cyan-top: #7dd3fc;
    --c-cyan-skirt: #0284c7;

    --c-green: #22c55e;
    --c-green-top: #86efac;
    --c-green-skirt: #15803d;

    --c-pink: #f43f5e;
    --c-pink-top: #fda4af;
    --c-pink-skirt: #be123c;

    --c-yellow: #facc15;
    --c-yellow-top: #fef08a;
    --c-yellow-skirt: #ca8a04;

    --c-orange: #fb923c;
    --c-orange-top: #fed7aa;
    --c-orange-skirt: #c2410c;

    --c-purple: #a855f7;
    --c-purple-top: #d8b4fe;
    --c-purple-skirt: #7e22ce;

    --c-slate-btn: #ffffff;
    --c-slate-top: #ffffff;
    --c-slate-skirt: #cbd5e1;
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: #f0f7ff;
    /* Soft doodle squiggly wavy SVG pattern + pastel confetti */
    background-image: 
      radial-gradient(#38bdf8 2px, transparent 2.5px),
      radial-gradient(#f43f5e 2px, transparent 2.5px),
      radial-gradient(#facc15 2px, transparent 2.5px),
      url("data:image/svg+xml,%3Csvg width='140' height='140' viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 20 Q 30 5, 50 25 T 90 20 T 125 45 Q 110 75, 80 55 T 40 75 T 15 105 Q 35 135, 65 125 T 115 135' stroke='%23cbd5e1' stroke-width='2.8' stroke-linecap='round' fill='none' opacity='0.75'/%3E%3C/svg%3E");
    background-size: 70px 70px, 110px 110px, 90px 90px, 140px 140px;
    background-position: 0 0, 35px 55px, 70px 25px, 0 0;
    font-family: 'Outfit', sans-serif;
    color: var(--navy);
    overflow: hidden;
  }

  /* JUICY CANDY BUTTON ENGINE */
  .candy-btn {
    border: var(--border-btn) solid var(--navy);
    font-family: 'Fredoka', sans-serif;
    font-weight: 900;
    text-align: center;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 
      inset 0 3px 0 rgba(255,255,255,0.55),
      inset 0 -3px 0 rgba(0,0,0,0.12),
      0 6px 0 var(--btn-skirt, #94a3b8),
      0 6px 0 var(--border-btn) var(--navy);
    transition: transform 0.05s ease, box-shadow 0.05s ease;
  }
  .candy-btn:active {
    transform: translateY(4px);
    box-shadow: 
      inset 0 2px 0 rgba(255,255,255,0.4),
      inset 0 -2px 0 rgba(0,0,0,0.1),
      0 2px 0 var(--btn-skirt, #94a3b8),
      0 2px 0 var(--border-btn) var(--navy);
  }

  .btn-cyan {
    background: linear-gradient(180deg, var(--c-cyan-top) 0%, var(--c-cyan) 60%);
    color: #ffffff;
    --btn-skirt: var(--c-cyan-skirt);
    text-shadow: 0 2px 0 rgba(2, 132, 199, 0.7);
  }
  .btn-green {
    background: linear-gradient(180deg, var(--c-green-top) 0%, var(--c-green) 60%);
    color: #ffffff;
    --btn-skirt: var(--c-green-skirt);
    text-shadow: 0 2px 0 rgba(21, 128, 61, 0.7);
  }
  .btn-pink {
    background: linear-gradient(180deg, var(--c-pink-top) 0%, var(--c-pink) 60%);
    color: #ffffff;
    --btn-skirt: var(--c-pink-skirt);
    text-shadow: 0 2px 0 rgba(190, 18, 60, 0.7);
  }
  .btn-yellow {
    background: linear-gradient(180deg, var(--c-yellow-top) 0%, var(--c-yellow) 60%);
    color: var(--navy);
    --btn-skirt: var(--c-yellow-skirt);
    text-shadow: 0 1px 0 rgba(255, 255, 255, 0.6);
  }
  .btn-orange {
    background: linear-gradient(180deg, var(--c-orange-top) 0%, var(--c-orange) 60%);
    color: #ffffff;
    --btn-skirt: var(--c-orange-skirt);
    text-shadow: 0 2px 0 rgba(194, 65, 12, 0.7);
  }
  .btn-white {
    background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
    color: var(--navy);
    --btn-skirt: var(--c-slate-skirt);
  }

  /* Universal Player Header */
  .player-strip-card {
    background: #ffffff;
    border: var(--border-w) solid var(--navy);
    border-radius: 24px;
    padding: 8px 14px;
    box-shadow: 0 5px 0 rgba(30, 41, 59, 0.12);
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    position: relative;
    z-index: 10;
  }
  .player-identity-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .player-avatar-circle {
    width: 48px;
    height: 48px;
    border: 3px solid var(--navy);
    border-radius: 50%;
    background: #bae6fd;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,0.12);
  }
  .player-text-group {
    display: flex;
    flex-direction: column;
  }
  .player-nickname {
    font-family: 'Fredoka', sans-serif;
    font-size: 21px;
    font-weight: 900;
    line-height: 1.1;
    color: var(--navy);
  }
  .player-role-sub {
    font-size: 11px;
    font-weight: 800;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .player-tag-pill {
    background: var(--navy);
    color: #ffffff;
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    font-weight: 900;
    padding: 6px 14px;
    border-radius: 14px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.15);
  }
  .tag-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
  }

  /* Soundboard Bottom Strip */
  .soundboard-card {
    background: #ffffff;
    border: var(--border-w) solid var(--navy);
    border-radius: 20px;
    padding: 8px 10px;
    box-shadow: 0 4px 0 rgba(30, 41, 59, 0.1);
    margin-top: auto;
  }
  .soundboard-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
  }
  .sb-mini-btn {
    background: #f8fafc;
    border: 2px solid var(--navy);
    border-radius: 10px;
    padding: 6px 2px;
    font-family: 'Fredoka', sans-serif;
    font-size: 11px;
    font-weight: 900;
    color: var(--navy);
    text-align: center;
    box-shadow: 0 3px 0 var(--navy);
    cursor: pointer;
  }
  .sb-mini-btn:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--navy);
  }

    body {
      width: 412px; height: 850px;
      padding: 16px;
      display: flex; flex-direction: column;
    }
    .guide-card {
      background: #ffffff;
      border: var(--border-w) solid var(--navy);
      border-radius: 22px;
      padding: 12px 16px;
      box-shadow: 0 5px 0 rgba(30, 41, 59, 0.12);
      text-align: center;
      margin-bottom: 12px;
    }
    .guide-title {
      font-family: 'Fredoka', sans-serif;
      font-size: 18px;
      font-weight: 900;
      color: var(--navy);
      margin-bottom: 4px;
    }
    .guide-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e0f2fe;
      border: 2px solid #0284c7;
      border-radius: 12px;
      padding: 4px 14px;
      font-size: 13px;
      font-weight: 900;
      color: #0369a1;
    }

    /* Tactile Main Board */
    .tactile-board {
      flex: 1;
      background: #ffffff;
      border: var(--border-w) solid var(--navy);
      border-radius: 32px;
      padding: 24px 20px;
      box-shadow: 0 8px 0 rgba(30, 41, 59, 0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      margin-bottom: 12px;
    }

    /* Chunky Arcade D-PAD with Candy Inset */
    .arcade-dpad {
      width: 230px;
      height: 230px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-track {
      position: absolute;
      width: 82px;
      height: 230px;
      background: #e2e8f0;
      border: var(--border-w) solid var(--navy);
      border-radius: 24px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.12);
    }
    .dpad-track.horizontal {
      width: 230px;
      height: 82px;
    }
    .dpad-center-hub {
      position: absolute;
      width: 68px;
      height: 68px;
      background: #cbd5e1;
      border: 3px solid var(--navy);
      border-radius: 18px;
      z-index: 4;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
      display: flex; align-items: center; justify-content: center;
    }
    .dpad-center-hub::after {
      content: '';
      width: 22px; height: 22px;
      background: #94a3b8;
      border-radius: 50%;
      border: 2px solid var(--navy);
    }

    /* The 4 directional wings */
    .dpad-wing {
      position: absolute;
      z-index: 6;
      border-radius: 18px;
      font-family: 'Fredoka', sans-serif;
      font-size: 26px;
      color: var(--navy);
      cursor: pointer;
    }
    .dpad-wing.up {
      top: 6px; width: 72px; height: 70px;
    }
    .dpad-wing.down {
      bottom: 6px; width: 72px; height: 70px;
    }
    .dpad-wing.left {
      left: 6px; width: 70px; height: 72px;
    }
    .dpad-wing.right {
      right: 6px; width: 70px; height: 72px;
    }

    /* Actions */
    .actions-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn-action-main {
      width: 100%;
      height: 74px;
      border-radius: 24px;
      font-size: 23px;
      letter-spacing: 0.5px;
    }
    .btn-action-secondary {
      width: 100%;
      height: 52px;
      border-radius: 18px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="player-strip-card">
    <div class="player-identity-group">
      <div class="player-avatar-circle">
    <svg viewBox="0 0 112 112" width="56" height="56" xmlns="http://www.w3.org/2000/svg" class="avatar-svg  ">
      <!-- Sombra base -->
      <ellipse cx="56" cy="107" rx="28" ry="4" fill="#000000" opacity="0.22" class="avatar-shadow"/>

      <!-- Contenedor con altura dinámica -->
      <g >
        <!-- Pies / Zapatos animados para correr estilo Mario -->
        <g class="avatar-feet">
          
      <ellipse class="avatar-foot-left" cx="42" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
      <ellipse class="avatar-foot-right" cx="70" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
    
        </g>

        <!-- Cuerpo / Ropa (Sudadera, Polo, Chupa de Cuero o Camiseta Negra) -->
        <g id="body">
          <path d="M 32 80 C 26 88, 24 102, 34 104 L 78 104 C 88 102, 86 88, 80 80 Z" fill="#f59e0b" stroke="#1e293b" stroke-width="2.5"/>
          
    <!-- Cremallera central de sudadera -->
    <line x1="56" y1="80" x2="56" y2="103" stroke="#1e293b" stroke-width="2" stroke-dasharray="2 2"/>
  
        </g>

        <!-- Air Jordans CÓMICAMENTE GRANDES renderizadas por encima de la ropa si está activado -->
        

        <!-- Brazos / Manos animadas que bombean al correr -->
        <g class="avatar-arm-left">
          <circle class="avatar-hand-left" cx="28" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
        </g>
        <g class="avatar-arm-right">
          <circle class="avatar-hand-right" cx="84" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
          
        </g>

        <!-- Cabeza con silueta personalizada -->
        <g id="head" class="avatar-head">
          
    <!-- Cabeza redonda clásica South Park / Chibi -->
    <ellipse cx="56" cy="54" rx="34" ry="32" fill="#ffe0bd" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="34" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
    <circle cx="78" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
  
        </g>

        <!-- Pelo -->
        <g id="hair">
        <!-- Pelo Despeinado Chavalil (Ayrton) con mechones dinámicos y volumen -->
        <!-- Sombra base detrás de la silueta -->
        <path d="M 18 48 C 14 36, 18 24, 28 17 C 36 12, 48 11, 56 11 C 66 11, 76 13, 85 18 C 94 25, 98 36, 94 48 Q 78 30 56 30 Q 34 30 18 48 Z" fill="#090d16" opacity="0.45"/>
        <!-- Silueta principal texturada con picos naturales -->
        <path d="M 19 48 C 15 37, 18 27, 26 21 L 29 25 L 36 15 L 43 21 L 52 12 L 58 12 L 67 19 L 76 14 L 81 23 L 90 20 C 97 29, 97 39, 93 48 C 87 43, 81 42, 75 44 C 67 38, 57 39, 49 43 C 41 38, 31 39, 23 45 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Mechones frontales con caída sobre la frente -->
        <path d="M 27 43 Q 33 37 41 42 Q 49 36 57 41 Q 65 35 75 40 Q 82 36 86 43" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <!-- Mechones sueltos pícaros -->
        <path d="M 33 24 Q 38 18 44 23" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M 60 21 Q 66 16 71 22" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Brillo / highlight sutil superior -->
        <path d="M 38 19 Q 54 14 70 19" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
      </g>

        <!-- Ojos -->
        <g id="eyes">
        <!-- Ojos chinillos / achinados pícaros (Ayrton) -->
        <path d="M 32 53 Q 44 46 54 54 Q 44 51 32 53 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 58 54 Q 68 46 80 53 Q 68 51 58 54 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Pestañita pícara sonriente -->
        <line x1="31" y1="52" x2="27" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <line x1="81" y1="52" x2="85" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      </g>

        <!-- Boca -->
        <g id="mouth">
        <!-- Cara loca con lengua fuera desquiciada (Ayrton) -->
        <ellipse cx="56" cy="69" rx="12" ry="7" fill="#7f1d1d" stroke="#0f172a" stroke-width="2"/>
        <rect x="50" y="63" width="12" height="4" rx="1.5" fill="#ffffff"/>
        <!-- Lengua fuera cayendo hacia abajo -->
        <path d="M 49 69 C 48 84, 63 86, 62 70 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="1.8"/>
        <line x1="55.5" y1="70" x2="55.5" y2="79" stroke="#be123c" stroke-width="1.2"/>
        <!-- Gotita de baba derp -->
        <circle cx="64" cy="80" r="1.5" fill="#38bdf8" opacity="0.8"/>
      </g>

        <!-- Accesorios -->
        <g id="accessories"></g>
      </g>
    </svg>
  </div>
      <div class="player-text-group">
        <span class="player-nickname">Ayrton</span>
        <span class="player-role-sub">Anfitrión J1</span>
      </div>
    </div>
    <div class="player-tag-pill">
      <span class="tag-dot"></span>
      <span>AZUL · P1</span>
    </div>
  </header>

  <!-- Level Guide -->
  <div class="guide-card">
    <div class="guide-title">MAPA OVERWORLD</div>
    <div class="guide-pill">
      <span>📍 Mundo 1-1</span>
      <span style="opacity: 0.6;">·</span>
      <span>Pelotón 4/4 Listo</span>
    </div>
  </div>

  <!-- Tactile Board -->
  <div class="tactile-board">
    <!-- D-Pad -->
    <div class="arcade-dpad">
      <div class="dpad-track"></div>
      <div class="dpad-track horizontal"></div>
      <div class="dpad-center-hub"></div>
      
      <div class="candy-btn btn-cyan dpad-wing up">▲</div>
      <div class="candy-btn btn-cyan dpad-wing down">▼</div>
      <div class="candy-btn btn-cyan dpad-wing left">◀</div>
      <div class="candy-btn btn-cyan dpad-wing right">▶</div>
    </div>

    <!-- Actions -->
    <div class="actions-box">
      <div class="candy-btn btn-pink btn-action-main">
        ¡ENTRAR AL NIVEL!
      </div>
      <div class="candy-btn btn-yellow btn-action-secondary">
        📢 REUNIR PELOTÓN
      </div>
    </div>
  </div>

  <!-- Soundboard -->
  <footer class="soundboard-card">
    <div class="soundboard-grid">
      <div class="sb-mini-btn">BOCINA</div>
      <div class="sb-mini-btn">AUUU</div>
      <div class="sb-mini-btn">BING</div>
      <div class="sb-mini-btn">FAAAH</div>
      <div class="sb-mini-btn">OMG</div>
      <div class="sb-mini-btn">ALLAH</div>
    </div>
  </footer>
</body>
</html>
