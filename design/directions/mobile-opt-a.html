<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mando Opción A: Vertical Total</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chango&family=Fredoka:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    body {
      width: 100vw; height: 100dvh; overflow: hidden;
      background: #eef6ff;
      background-image: radial-gradient(#93c5fd 2.5px, transparent 2.5px);
      background-size: 28px 28px;
      font-family: 'Fredoka', sans-serif; color: #1e293b;
      display: flex; flex-direction: column;
      padding: env(safe-area-inset-top, 12px) 14px env(safe-area-inset-bottom, 12px) 14px;
      gap: 10px;
    }

    /* Top Strip */
    .top-strip {
      background: #ffffff; border: 3.5px solid #1e293b; border-radius: 20px;
      padding: 8px 12px; box-shadow: 4px 4px 0 #1e293b;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .profile-info { display: flex; align-items: center; gap: 10px; }
    .avatar-mini {
      width: 44px; height: 44px; border-radius: 50%; overflow: hidden;
      background: #bae6fd; border: 2.5px solid #1e293b;
      display: flex; align-items: center; justify-content: center;
    }
    .player-title { font-size: 20px; font-weight: 900; line-height: 1; }
    .player-sub { font-size: 12px; font-weight: 800; color: #0284c7; }
    .btn-gather-pill {
      background: #fde047; border: 2.5px solid #1e293b; border-radius: 12px;
      padding: 6px 12px; font-size: 13px; font-weight: 900; color: #1e293b;
      box-shadow: 2.5px 2.5px 0 #1e293b; cursor: pointer;
    }
    .btn-gather-pill:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #1e293b; }

    /* MIDDLE: MAIN CONTROLLER SURFACE (D-Pad + Action Buttons) */
    .control-zone {
      flex: 1.1; display: grid; grid-template-columns: 1.1fr 1fr; gap: 12px;
      align-items: center; justify-content: center;
      background: #ffffff; border: 4px solid #1e293b; border-radius: 28px;
      padding: 14px; box-shadow: 5px 5px 0 #1e293b;
    }

    /* D-PAD (Chunky comic cross) */
    .dpad-cross {
      display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px);
      gap: 4px; justify-content: center; align-content: center; margin: 0 auto;
    }
    .dp-key {
      background: #bae6fd; border: 3.5px solid #1e293b; border-radius: 16px;
      box-shadow: 0 5px 0 #0284c7, 0 5px 0 3px #1e293b;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 900; color: #0f172a; cursor: pointer;
    }
    .dp-key:active { transform: translateY(3px); box-shadow: 0 2px 0 #0284c7, 0 2px 0 3px #1e293b; }
    .dp-up { grid-column: 2; grid-row: 1; }
    .dp-left { grid-column: 1; grid-row: 2; }
    .dp-center {
      grid-column: 2; grid-row: 2; background: #e0f2fe; border: 2.5px dashed #0284c7; border-radius: 10px;
    }
    .dp-right { grid-column: 3; grid-row: 2; }
    .dp-down { grid-column: 2; grid-row: 3; }

    /* Action Candy Buttons */
    .action-side {
      display: flex; flex-direction: column; gap: 12px; height: 100%; justify-content: center;
    }
    .btn-candy-action {
      flex: 1; border: 4px solid #1e293b; border-radius: 22px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; text-align: center;
    }
    .btn-candy-action.primary {
      background: #f43f5e; color: #ffffff;
      box-shadow: 0 6px 0 #9f1239, 0 6px 0 3.5px #1e293b;
    }
    .btn-candy-action.primary:active { transform: translateY(3px); box-shadow: 0 3px 0 #9f1239, 0 3px 0 3.5px #1e293b; }
    .btn-candy-action.secondary {
      background: #22c55e; color: #ffffff;
      box-shadow: 0 6px 0 #15803d, 0 6px 0 3.5px #1e293b;
    }
    .btn-candy-action.secondary:active { transform: translateY(3px); box-shadow: 0 3px 0 #15803d, 0 3px 0 3.5px #1e293b; }

    .candy-lbl { font-family: 'Chango', cursive; font-size: 18px; line-height: 1; text-shadow: 1px 1px 0 rgba(0,0,0,0.3); }
    .candy-sub { font-size: 11px; font-weight: 900; opacity: 0.9; margin-top: 2px; }

    /* BOTTOM: BIG SOUNDBOARD MEME (30% OF SCREEN) */
    .soundboard-panel {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 26px;
      padding: 12px; box-shadow: 5px 5px 0 #1e293b; display: flex; flex-direction: column; gap: 8px;
      flex-shrink: 0;
    }
    .sb-hdr {
      display: flex; justify-content: space-between; align-items: center;
    }
    .sb-hdr-title { font-family: 'Chango', cursive; font-size: 14px; color: #1e293b; }
    .sb-hdr-hint { font-size: 11px; font-weight: 800; color: #0284c7; }

    .sb-grid-big {
      display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(2, 48px); gap: 8px;
    }
    .sb-big-btn {
      border: 3px solid #1e293b; border-radius: 16px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-size: 13px; font-weight: 900; cursor: pointer; color: #0f172a;
      box-shadow: 0 4px 0 #1e293b;
    }
    .sb-big-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1e293b; }
    .sb-bocina { background: #fed7aa; }
    .sb-auuu   { background: #bae6fd; }
    .sb-bing   { background: #fef08a; }
    .sb-faaah  { background: #fecdd3; }
    .sb-omg    { background: #ddd6fe; }
    .sb-allah  { background: #bbf7d0; }
  </style>
</head>
<body>
  <div class="top-strip">
    <div class="profile-info">
      <div class="avatar-mini">
    <svg viewBox="0 0 112 112" width="56" height="56" xmlns="http://www.w3.org/2000/svg" class="avatar-svg  ">
      <!-- Sombra base -->
      <ellipse cx="56" cy="107" rx="28" ry="4" fill="#000000" opacity="0.22" class="avatar-shadow"/>

      <!-- Contenedor con altura dinámica -->
      <g >
        <!-- Pies / Zapatos animados para correr estilo Mario -->
        <g class="avatar-feet">
          
      <ellipse class="avatar-foot-left" cx="42" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
      <ellipse class="avatar-foot-right" cx="70" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
    
        </g>

        <!-- Cuerpo / Ropa (Sudadera, Polo, Chupa de Cuero o Camiseta Negra) -->
        <g id="body">
          <path d="M 32 80 C 26 88, 24 102, 34 104 L 78 104 C 88 102, 86 88, 80 80 Z" fill="#f59e0b" stroke="#1e293b" stroke-width="2.5"/>
          
    <!-- Cremallera central de sudadera -->
    <line x1="56" y1="80" x2="56" y2="103" stroke="#1e293b" stroke-width="2" stroke-dasharray="2 2"/>
  
        </g>

        <!-- Air Jordans CÓMICAMENTE GRANDES renderizadas por encima de la ropa si está activado -->
        

        <!-- Brazos / Manos animadas que bombean al correr -->
        <g class="avatar-arm-left">
          <circle class="avatar-hand-left" cx="28" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
        </g>
        <g class="avatar-arm-right">
          <circle class="avatar-hand-right" cx="84" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
          
        </g>

        <!-- Cabeza con silueta personalizada -->
        <g id="head" class="avatar-head">
          
    <!-- Cabeza redonda clásica South Park / Chibi -->
    <ellipse cx="56" cy="54" rx="34" ry="32" fill="#ffe0bd" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="34" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
    <circle cx="78" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
  
        </g>

        <!-- Pelo -->
        <g id="hair">
        <!-- Pelo Despeinado Chavalil (Ayrton) con mechones dinámicos y volumen -->
        <!-- Sombra base detrás de la silueta -->
        <path d="M 18 48 C 14 36, 18 24, 28 17 C 36 12, 48 11, 56 11 C 66 11, 76 13, 85 18 C 94 25, 98 36, 94 48 Q 78 30 56 30 Q 34 30 18 48 Z" fill="#090d16" opacity="0.45"/>
        <!-- Silueta principal texturada con picos naturales -->
        <path d="M 19 48 C 15 37, 18 27, 26 21 L 29 25 L 36 15 L 43 21 L 52 12 L 58 12 L 67 19 L 76 14 L 81 23 L 90 20 C 97 29, 97 39, 93 48 C 87 43, 81 42, 75 44 C 67 38, 57 39, 49 43 C 41 38, 31 39, 23 45 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Mechones frontales con caída sobre la frente -->
        <path d="M 27 43 Q 33 37 41 42 Q 49 36 57 41 Q 65 35 75 40 Q 82 36 86 43" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <!-- Mechones sueltos pícaros -->
        <path d="M 33 24 Q 38 18 44 23" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M 60 21 Q 66 16 71 22" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Brillo / highlight sutil superior -->
        <path d="M 38 19 Q 54 14 70 19" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
      </g>

        <!-- Ojos -->
        <g id="eyes">
        <!-- Ojos chinillos / achinados pícaros (Ayrton) -->
        <path d="M 32 53 Q 44 46 54 54 Q 44 51 32 53 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 58 54 Q 68 46 80 53 Q 68 51 58 54 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Pestañita pícara sonriente -->
        <line x1="31" y1="52" x2="27" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <line x1="81" y1="52" x2="85" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      </g>

        <!-- Boca -->
        <g id="mouth">
        <!-- Cara loca con lengua fuera desquiciada (Ayrton) -->
        <ellipse cx="56" cy="69" rx="12" ry="7" fill="#7f1d1d" stroke="#0f172a" stroke-width="2"/>
        <rect x="50" y="63" width="12" height="4" rx="1.5" fill="#ffffff"/>
        <!-- Lengua fuera cayendo hacia abajo -->
        <path d="M 49 69 C 48 84, 63 86, 62 70 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="1.8"/>
        <line x1="55.5" y1="70" x2="55.5" y2="79" stroke="#be123c" stroke-width="1.2"/>
        <!-- Gotita de baba derp -->
        <circle cx="64" cy="80" r="1.5" fill="#38bdf8" opacity="0.8"/>
      </g>

        <!-- Accesorios -->
        <g id="accessories"></g>
      </g>
    </svg>
  </div>
      <div>
        <div class="player-title">Ayrton</div>
        <div class="player-sub">📍 MUNDO 1-1 · J1</div>
      </div>
    </div>
    <div class="btn-gather-pill">🧲 ¡TODOS AQUÍ!</div>
  </div>

  <div class="control-zone">
    <!-- D-PAD -->
    <div class="dpad-cross">
      <div class="dp-key dp-up">▲</div>
      <div class="dp-key dp-left">◀</div>
      <div class="dp-center"></div>
      <div class="dp-key dp-right">▶</div>
      <div class="dp-key dp-down">▼</div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="action-side">
      <div class="btn-candy-action primary">
        <span class="candy-lbl">ENTRAR</span>
        <span class="candy-sub">AL NIVEL</span>
      </div>
      <div class="btn-candy-action secondary">
        <span class="candy-lbl">AVANZAR</span>
        <span class="candy-sub">EN EL MAPA</span>
      </div>
    </div>
  </div>

  <div class="soundboard-panel">
    <div class="sb-hdr">
      <span class="sb-hdr-title">🔊 SOUNDBOARD MEME</span>
      <span class="sb-hdr-hint">PULSA PARA REACCIONAR</span>
    </div>
    <div class="sb-grid-big">
      <div class="sb-big-btn sb-bocina">📢 BOCINA</div>
      <div class="sb-big-btn sb-auuu">🐺 AUUUU</div>
      <div class="sb-big-btn sb-bing">🍦 BING</div>
      <div class="sb-big-btn sb-faaah">🗣️ FAAAH</div>
      <div class="sb-big-btn sb-omg">😱 OMG</div>
      <div class="sb-big-btn sb-allah">💣 ALLAH</div>
    </div>
  </div>
</body>
</html>
