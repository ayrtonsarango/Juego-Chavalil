<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mando Mario Kart</title>
  <style>
    
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap');

  :root {
    --navy: #1e293b;
    --navy-dark: #0f172a;
    --navy-skirt: #090d16;
    --border-w: 3.5px;
    --bg-page: #edf5fd;
    --bg-card: #ffffff;
    
    --c-cyan: #38bdf8;
    --c-cyan-skirt: #0284c7;
    --c-green: #22c55e;
    --c-green-skirt: #15803d;
    --c-pink: #f43f5e;
    --c-pink-skirt: #be123c;
    --c-yellow: #facc15;
    --c-yellow-skirt: #ca8a04;
    --c-orange: #fb923c;
    --c-orange-skirt: #c2410c;
    --c-purple: #a855f7;
    --c-purple-skirt: #7e22ce;
  }

  * {
    margin: 0; padding: 0; box-sizing: border-box;
    user-select: none; -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background-color: var(--bg-page);
    /* Doodle doodle squiggly pattern + candy confetti sprinkles */
    background-image: 
      radial-gradient(#93c5fd 2px, transparent 2.5px),
      radial-gradient(#fca5a5 2px, transparent 2.5px),
      radial-gradient(#fde047 2px, transparent 2.5px),
      url("data:image/svg+xml,%3Csvg width='160' height='160' viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M10 25 Q 35 5, 60 30 T 110 25 T 145 55 Q 130 90, 100 70 T 50 90 T 20 125 Q 45 155, 80 140 T 135 150' stroke='%23cbd5e1' stroke-width='3' stroke-linecap='round' fill='none' opacity='0.7'/%3E%3C/svg%3E");
    background-size: 80px 80px, 120px 120px, 95px 95px, 160px 160px;
    background-position: 0 0, 40px 60px, 80px 30px, 0 0;
    font-family: 'Outfit', sans-serif;
    color: var(--navy);
    overflow: hidden;
  }

  /* Universal Player Identity Strip */
  .player-header {
    background: #ffffff;
    border: var(--border-w) solid var(--navy);
    border-radius: 22px;
    padding: 8px 14px;
    box-shadow: 0 5px 0 rgba(30, 41, 59, 0.14);
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    z-index: 10;
  }
  .player-identity {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .avatar-frame {
    width: 44px;
    height: 44px;
    border: 2.5px solid var(--navy);
    border-radius: 50%;
    background: #bae6fd;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .player-name-wrap {
    display: flex;
    flex-direction: column;
  }
  .player-name {
    font-family: 'Fredoka', sans-serif;
    font-size: 20px;
    font-weight: 900;
    line-height: 1.1;
    color: var(--navy);
  }
  .player-sub {
    font-size: 11px;
    font-weight: 800;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .player-badge-pill {
    background: var(--navy);
    color: #ffffff;
    font-family: 'Fredoka', sans-serif;
    font-size: 13px;
    font-weight: 900;
    padding: 5px 12px;
    border-radius: 12px;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot-online {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 6px #22c55e;
  }

  /* Universal Candy-Arcade Button Mixin */
  .candy-btn {
    border: var(--border-w) solid var(--navy);
    border-radius: 20px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 900;
    text-align: center;
    cursor: pointer;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.06s ease, box-shadow 0.06s ease;
  }
  .candy-btn:active {
    transform: translateY(4px);
  }

  /* Soundboard Bottom Strip */
  .soundboard-drawer {
    background: #ffffff;
    border: var(--border-w) solid var(--navy);
    border-radius: 20px;
    padding: 8px 10px;
    box-shadow: 0 4px 0 rgba(30, 41, 59, 0.12);
    margin-top: auto;
  }
  .sb-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
    padding: 0 4px;
  }
  .sb-title {
    font-size: 11px;
    font-weight: 900;
    color: #64748b;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .sb-chips-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 5px;
  }
  .sb-chip {
    background: #f8fafc;
    border: 2px solid var(--navy);
    border-radius: 10px;
    padding: 6px 2px;
    font-family: 'Fredoka', sans-serif;
    font-size: 11px;
    font-weight: 900;
    color: var(--navy);
    text-align: center;
    box-shadow: 0 3px 0 var(--navy);
    cursor: pointer;
  }
  .sb-chip:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 var(--navy);
  }

    body {
      width: 850px; height: 412px;
      padding: 12px 18px;
      display: flex; flex-direction: column;
    }
    .hud-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: #ffffff;
      border: var(--border-w) solid var(--navy);
      border-radius: 18px;
      padding: 6px 14px;
      box-shadow: 0 4px 0 rgba(30, 41, 59, 0.12);
      margin-bottom: 10px;
    }
    .hud-left {
      display: flex; align-items: center; gap: 10px;
    }
    .hud-title {
      font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 900; color: var(--navy);
    }
    .hud-right {
      display: flex; align-items: center; gap: 8px;
    }
    .hud-pill {
      background: #fef08a; border: 2px solid var(--navy); border-radius: 10px;
      padding: 2px 10px; font-family: 'Fredoka', sans-serif; font-size: 13px; font-weight: 900;
    }

    /* 50% / 50% Two-Thumb Surface */
    .kart-surface {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }

    /* Left Steer Zones */
    .steer-zone-wrapper {
      background: #ffffff;
      border: var(--border-w) solid var(--navy);
      border-radius: 26px;
      padding: 10px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      box-shadow: 0 6px 0 rgba(30, 41, 59, 0.12);
    }
    .btn-steer {
      background: #e0f2fe;
      color: #0369a1;
      border-radius: 20px;
      font-size: 38px;
      flex-direction: column;
      gap: 6px;
      box-shadow: 0 6px 0 #7dd3fc, 0 6px 0 var(--border-w) var(--navy);
    }
    .btn-steer span {
      font-size: 14px; font-weight: 900; letter-spacing: 0.5px;
    }
    .btn-steer:active {
      box-shadow: 0 2px 0 #7dd3fc, 0 2px 0 var(--border-w) var(--navy);
      transform: translateY(4px);
    }

    /* Right Action Cluster */
    .action-zone-wrapper {
      background: #ffffff;
      border: var(--border-w) solid var(--navy);
      border-radius: 26px;
      padding: 10px;
      display: flex; flex-direction: column; gap: 10px;
      box-shadow: 0 6px 0 rgba(30, 41, 59, 0.12);
    }
    .btn-gas {
      flex: 1.3;
      background: #22c55e;
      color: #ffffff;
      font-size: 26px;
      border-radius: 18px;
      box-shadow: 0 6px 0 var(--c-green-skirt), 0 6px 0 var(--border-w) var(--navy);
      text-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }
    .btn-gas:active {
      box-shadow: 0 2px 0 var(--c-green-skirt), 0 2px 0 var(--border-w) var(--navy);
      transform: translateY(4px);
    }
    .sub-actions-row {
      flex: 1; display: grid; grid-template-columns: 1fr 1.2fr; gap: 10px;
    }
    .btn-drift {
      background: #f43f5e;
      color: #ffffff;
      font-size: 18px;
      border-radius: 16px;
      box-shadow: 0 5px 0 var(--c-pink-skirt), 0 5px 0 var(--border-w) var(--navy);
    }
    .btn-drift:active {
      box-shadow: 0 2px 0 var(--c-pink-skirt), 0 2px 0 var(--border-w) var(--navy);
      transform: translateY(3px);
    }
    .btn-item {
      background: #facc15;
      color: var(--navy);
      font-size: 18px;
      border-radius: 16px;
      box-shadow: 0 5px 0 var(--c-yellow-skirt), 0 5px 0 var(--border-w) var(--navy);
    }
    .btn-item:active {
      box-shadow: 0 2px 0 var(--c-yellow-skirt), 0 2px 0 var(--border-w) var(--navy);
      transform: translateY(3px);
    }
  </style>
</head>
<body>
  <div class="hud-bar">
    <div class="hud-left">
      <div class="avatar-frame" style="width: 34px; height: 34px;">
    <svg viewBox="0 0 112 112" width="40" height="40" xmlns="http://www.w3.org/2000/svg" class="avatar-svg  ">
      <!-- Sombra base -->
      <ellipse cx="56" cy="107" rx="28" ry="4" fill="#000000" opacity="0.22" class="avatar-shadow"/>

      <!-- Contenedor con altura dinámica -->
      <g >
        <!-- Pies / Zapatos animados para correr estilo Mario -->
        <g class="avatar-feet">
          
      <ellipse class="avatar-foot-left" cx="42" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
      <ellipse class="avatar-foot-right" cx="70" cy="105" rx="8.5" ry="5" fill="#0f172a"/>
    
        </g>

        <!-- Cuerpo / Ropa (Sudadera, Polo, Chupa de Cuero o Camiseta Negra) -->
        <g id="body">
          <path d="M 32 80 C 26 88, 24 102, 34 104 L 78 104 C 88 102, 86 88, 80 80 Z" fill="#f59e0b" stroke="#1e293b" stroke-width="2.5"/>
          
    <!-- Cremallera central de sudadera -->
    <line x1="56" y1="80" x2="56" y2="103" stroke="#1e293b" stroke-width="2" stroke-dasharray="2 2"/>
  
        </g>

        <!-- Air Jordans CÓMICAMENTE GRANDES renderizadas por encima de la ropa si está activado -->
        

        <!-- Brazos / Manos animadas que bombean al correr -->
        <g class="avatar-arm-left">
          <circle class="avatar-hand-left" cx="28" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
        </g>
        <g class="avatar-arm-right">
          <circle class="avatar-hand-right" cx="84" cy="94" r="7" fill="#ffe0bd" stroke="#1e293b" stroke-width="2"/>
          
        </g>

        <!-- Cabeza con silueta personalizada -->
        <g id="head" class="avatar-head">
          
    <!-- Cabeza redonda clásica South Park / Chibi -->
    <ellipse cx="56" cy="54" rx="34" ry="32" fill="#ffe0bd" stroke="#1e293b" stroke-width="2.5"/>
    <circle cx="34" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
    <circle cx="78" cy="62" r="5" fill="#f43f5e" opacity="0.25"/>
  
        </g>

        <!-- Pelo -->
        <g id="hair">
        <!-- Pelo Despeinado Chavalil (Ayrton) con mechones dinámicos y volumen -->
        <!-- Sombra base detrás de la silueta -->
        <path d="M 18 48 C 14 36, 18 24, 28 17 C 36 12, 48 11, 56 11 C 66 11, 76 13, 85 18 C 94 25, 98 36, 94 48 Q 78 30 56 30 Q 34 30 18 48 Z" fill="#090d16" opacity="0.45"/>
        <!-- Silueta principal texturada con picos naturales -->
        <path d="M 19 48 C 15 37, 18 27, 26 21 L 29 25 L 36 15 L 43 21 L 52 12 L 58 12 L 67 19 L 76 14 L 81 23 L 90 20 C 97 29, 97 39, 93 48 C 87 43, 81 42, 75 44 C 67 38, 57 39, 49 43 C 41 38, 31 39, 23 45 Z" fill="#1e293b" stroke="#0f172a" stroke-width="2.2" stroke-linejoin="round"/>
        <!-- Mechones frontales con caída sobre la frente -->
        <path d="M 27 43 Q 33 37 41 42 Q 49 36 57 41 Q 65 35 75 40 Q 82 36 86 43" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <!-- Mechones sueltos pícaros -->
        <path d="M 33 24 Q 38 18 44 23" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M 60 21 Q 66 16 71 22" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Brillo / highlight sutil superior -->
        <path d="M 38 19 Q 54 14 70 19" fill="none" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
      </g>

        <!-- Ojos -->
        <g id="eyes">
        <!-- Ojos chinillos / achinados pícaros (Ayrton) -->
        <path d="M 32 53 Q 44 46 54 54 Q 44 51 32 53 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 58 54 Q 68 46 80 53 Q 68 51 58 54 Z" fill="#0f172a" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Pestañita pícara sonriente -->
        <line x1="31" y1="52" x2="27" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
        <line x1="81" y1="52" x2="85" y2="49" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
      </g>

        <!-- Boca -->
        <g id="mouth">
        <!-- Cara loca con lengua fuera desquiciada (Ayrton) -->
        <ellipse cx="56" cy="69" rx="12" ry="7" fill="#7f1d1d" stroke="#0f172a" stroke-width="2"/>
        <rect x="50" y="63" width="12" height="4" rx="1.5" fill="#ffffff"/>
        <!-- Lengua fuera cayendo hacia abajo -->
        <path d="M 49 69 C 48 84, 63 86, 62 70 Z" fill="#f43f5e" stroke="#0f172a" stroke-width="1.8"/>
        <line x1="55.5" y1="70" x2="55.5" y2="79" stroke="#be123c" stroke-width="1.2"/>
        <!-- Gotita de baba derp -->
        <circle cx="64" cy="80" r="1.5" fill="#38bdf8" opacity="0.8"/>
      </g>

        <!-- Accesorios -->
        <g id="accessories"></g>
      </g>
    </svg>
  </div>
      <span class="hud-title">🏎️ MARIO KART · AYRTON (P1)</span>
    </div>
    <div class="hud-right">
      <span class="hud-pill">🏁 VUELTA 2 / 3</span>
      <span class="hud-pill" style="background: #bae6fd;">POS: 1º</span>
    </div>
  </div>

  <div class="kart-surface">
    <!-- Left Steer 50% -->
    <div class="steer-zone-wrapper">
      <div class="candy-btn btn-steer">
        ◀
        <span>IZQUIERDA</span>
      </div>
      <div class="candy-btn btn-steer">
        ▶
        <span>DERECHA</span>
      </div>
    </div>

    <!-- Right Clúster 50% -->
    <div class="action-zone-wrapper">
      <div class="candy-btn btn-gas">
        🟢 ACELERAR
      </div>
      <div class="sub-actions-row">
        <div class="candy-btn btn-drift">
          ⚡ DERRAPE
        </div>
        <div class="candy-btn btn-item">
          ❓ OBJETO
        </div>
      </div>
    </div>
  </div>
</body>
</html>
