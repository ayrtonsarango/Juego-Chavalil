<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mando Mario Kart Light</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chango&family=Fredoka:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    body {
      width: 100vw; height: 100dvh; overflow: hidden;
      background: #f0f7ff;
      background-image: radial-gradient(#93c5fd 2.5px, transparent 2.5px);
      background-size: 24px 24px;
      font-family: 'Fredoka', sans-serif; color: #1e293b;
      display: flex; flex-direction: column;
    }
    .phone-hdr-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; color: #ffffff; border-radius: 18px;
      padding: 8px 14px; margin-bottom: 8px; flex-shrink: 0;
    }
    .phone-hdr-user { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; }
    .dot-blue { width: 10px; height: 10px; border-radius: 50%; background: #38bdf8; display: inline-block; }
    .badge-sub { background: #38bdf8; color: #0f172a; border-radius: 8px; padding: 2px 8px; font-size: 11px; font-weight: 900; }
  
    body { padding: 10px env(safe-area-inset-right, 16px) 10px env(safe-area-inset-left, 16px); gap: 8px; }
    
    .kart-board {
      flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
    }
    
    /* Left: Big Direction Paddles */
    .steer-box {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 26px;
      padding: 12px; box-shadow: 5px 5px 0 #1e293b;
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .btn-steer {
      border: 3.5px solid #1e293b; border-radius: 20px; background: #bae6fd;
      box-shadow: 0 6px 0 #0284c7, 0 6px 0 2.5px #1e293b;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .btn-steer:active { transform: translateY(3px); box-shadow: 0 2px 0 #0284c7, 0 2px 0 2.5px #1e293b; }
    .steer-arrow { font-size: 38px; font-weight: 900; }
    .steer-lbl { font-family: 'Chango', cursive; font-size: 15px; margin-top: 4px; }

    /* Right: Candy Stack (Panel 4 style: Acelerar, Derrape, Objeto) */
    .candy-stack-box {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 26px;
      padding: 12px; box-shadow: 5px 5px 0 #1e293b;
      display: flex; flex-direction: column; gap: 8px; justify-content: center;
    }
    .btn-candy-action {
      flex: 1; border: 3.5px solid #1e293b; border-radius: 18px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; font-family: 'Chango', cursive; font-size: 16px;
    }
    .btn-candy-action:active { transform: translateY(2px); }

    .btn-gas {
      background: #4ade80; color: #0f172a;
      box-shadow: 0 5px 0 #16a34a, 0 5px 0 2.5px #1e293b;
    }
    .btn-gas:active { box-shadow: 0 2px 0 #16a34a, 0 2px 0 2.5px #1e293b; }

    .btn-drift {
      background: #f472b6; color: #ffffff;
      box-shadow: 0 5px 0 #db2777, 0 5px 0 2.5px #1e293b;
    }
    .btn-drift:active { box-shadow: 0 2px 0 #db2777, 0 2px 0 2.5px #1e293b; }

    .btn-item {
      background: #facc15; color: #0f172a;
      box-shadow: 0 5px 0 #ca8a04, 0 5px 0 2.5px #1e293b;
    }
    .btn-item:active { box-shadow: 0 2px 0 #ca8a04, 0 2px 0 2.5px #1e293b; }
  </style>
</head>
<body>
  <div class="phone-hdr-bar">
    <div class="phone-hdr-user">
      <span class="dot-blue"></span>
      <span>MARIO KART · AYRTON (AZUL)</span>
    </div>
    <div class="badge-sub">VUELTA 2/3 · 1º PUESTO 👑</div>
  </div>

  <div class="kart-board">
    <div class="steer-box">
      <div class="btn-steer">
        <span class="steer-arrow">◀</span>
        <span class="steer-lbl">IZQUIERDA</span>
      </div>
      <div class="btn-steer">
        <span class="steer-arrow">▶</span>
        <span class="steer-lbl">DERECHA</span>
      </div>
    </div>

    <div class="candy-stack-box">
      <div class="btn-candy-action btn-gas">⚡ ACELERAR</div>
      <div class="btn-candy-action btn-drift">💨 DERRAPE</div>
      <div class="btn-candy-action btn-item">❓ OBJETO</div>
    </div>
  </div>
</body>
</html>
