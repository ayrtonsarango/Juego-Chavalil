<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mando Mapa Light</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chango&family=Fredoka:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    
    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
    body {
      width: 100vw; height: 100dvh; overflow: hidden;
      background: #f0f7ff;
      background-image: radial-gradient(#93c5fd 2.5px, transparent 2.5px);
      background-size: 24px 24px;
      font-family: 'Fredoka', sans-serif; color: #1e293b;
      display: flex; flex-direction: column;
    }
    .phone-hdr-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; color: #ffffff; border-radius: 18px;
      padding: 8px 14px; margin-bottom: 8px; flex-shrink: 0;
    }
    .phone-hdr-user { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 900; }
    .dot-blue { width: 10px; height: 10px; border-radius: 50%; background: #38bdf8; display: inline-block; }
    .badge-sub { background: #38bdf8; color: #0f172a; border-radius: 8px; padding: 2px 8px; font-size: 11px; font-weight: 900; }
  
    body { padding: env(safe-area-inset-top, 12px) 14px env(safe-area-inset-bottom, 12px) 14px; gap: 8px; }
    
    .map-arena {
      flex: 1; background: #ffffff; border: 4px solid #1e293b; border-radius: 28px;
      padding: 16px; box-shadow: 5px 5px 0 #1e293b;
      display: flex; flex-direction: column; justify-content: space-between; align-items: center;
    }
    .hud-instruct {
      font-family: 'Chango', cursive; font-size: 15px; color: #0284c7; text-align: center;
    }
    .dpad-cross {
      display: grid; grid-template-columns: repeat(3, 76px); grid-template-rows: repeat(3, 76px);
      gap: 6px; justify-content: center; align-content: center;
    }
    .dp-k {
      background: #bae6fd; border: 3.5px solid #1e293b; border-radius: 18px;
      box-shadow: 0 5px 0 #0284c7, 0 5px 0 2.5px #1e293b;
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; font-weight: 900; color: #0f172a; cursor: pointer;
    }
    .dp-k:active { transform: translateY(3px); box-shadow: 0 2px 0 #0284c7, 0 2px 0 2.5px #1e293b; }
    .dp-u { grid-column: 2; grid-row: 1; }
    .dp-l { grid-column: 1; grid-row: 2; }
    .dp-c { grid-column: 2; grid-row: 2; background: #e0f2fe; border: 2.5px dashed #38bdf8; border-radius: 12px; }
    .dp-r { grid-column: 3; grid-row: 2; }
    .dp-d { grid-column: 2; grid-row: 3; }

    .btn-enter {
      width: 100%; height: 60px; border: 4px solid #1e293b; border-radius: 20px;
      background: #f472b6; color: #ffffff;
      box-shadow: 0 6px 0 #db2777, 0 6px 0 3px #1e293b;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      cursor: pointer; font-family: 'Chango', cursive; font-size: 18px;
    }
    .btn-enter:active { transform: translateY(3px); box-shadow: 0 2px 0 #db2777, 0 2px 0 3px #1e293b; }

    .sb-shelf {
      background: #ffffff; border: 4px solid #1e293b; border-radius: 22px;
      padding: 10px; box-shadow: 4px 4px 0 #1e293b; flex-shrink: 0;
    }
    .sb-hdr-txt { font-family: 'Chango', cursive; font-size: 12px; color: #1e293b; margin-bottom: 6px; }
    .sb-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .sb-k {
      border: 2.5px solid #1e293b; border-radius: 12px; height: 40px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 900; color: #0f172a; box-shadow: 0 3px 0 #1e293b;
    }
  </style>
</head>
<body>
  <div class="phone-hdr-bar">
    <div class="phone-hdr-user">
      <span class="dot-blue"></span>
      <span>AYRTON (AZUL)</span>
    </div>
    <div class="badge-sub">MUNDO 1-1 · J1</div>
  </div>

  <div class="map-arena">
    <div class="hud-instruct">MUÉVETE POR EL MAPA</div>

    <div class="dpad-cross">
      <div class="dp-k dp-u">▲</div>
      <div class="dp-k dp-l">◀</div>
      <div class="dp-c"></div>
      <div class="dp-k dp-r">▶</div>
      <div class="dp-k dp-d">▼</div>
    </div>

    <div class="btn-enter">¡ENTRAR AL NIVEL!</div>
  </div>

  <div class="sb-shelf">
    <div class="sb-hdr-txt">🔊 MEME SOUNDBOARD</div>
    <div class="sb-grid">
      <div class="sb-k" style="background:#fed7aa;">📢 BOCINA</div>
      <div class="sb-k" style="background:#bae6fd;">🐺 AUUUU</div>
      <div class="sb-k" style="background:#fef08a;">🍦 BING</div>
      <div class="sb-k" style="background:#fecdd3;">🗣️ FAAAH</div>
      <div class="sb-k" style="background:#ddd6fe;">😱 OMG</div>
      <div class="sb-k" style="background:#bbf7d0;">💣 ALLAH</div>
    </div>
  </div>
</body>
</html>
